<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080e" />
<title>雨夜 · 民俗街角</title>
<style>html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #07080e;
}

body {
  /* 无 UI：整屏只有 canvas，背景只做一层极淡的夜色渐变 */
  background:
    radial-gradient(120% 90% at 50% 18%, #131a2b 0%, #0b0e18 45%, #05060a 100%);
  cursor: grab;
}

canvas#scene {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

canvas.grabbing { cursor: grabbing; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(72% 62% at 50% 46%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.42) 100%);
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #e8dfcd;
  font: 500 15px/1.7 "Songti SC", "SimSun", "Microsoft YaHei", serif;
  letter-spacing: 0.22em;
  background: #07080e;
  transition: opacity 0.9s ease, visibility 0.9s;
  z-index: 10;
}

#boot span { font-size: 20px; letter-spacing: 0.34em; color: #f0e3c8; }
#boot i { font-style: normal; font-size: 12px; color: #8d8577; letter-spacing: 0.3em; }
#boot.gone { opacity: 0; visibility: hidden; }

#boot.error {
  align-items: flex-start;
  padding: 8vh 9vw;
  letter-spacing: normal;
  font-family: "Microsoft YaHei", sans-serif;
}
#boot.error h1 { font-size: 18px; color: #ffb4a0; margin: 0 0 12px; }
#boot.error pre { white-space: pre-wrap; font-size: 13px; color: #c9c2b4; max-width: 760px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="boot"><span>雨 夜 · 民 俗 街 角</span><i>正在组装模型</i></div>
<script>(function () {
  var panel = document.getElementById('boot');
  var booted = false;
  function show(title, detail) {
    if (booted) return;
    booted = true;
    panel.className = 'error';
    panel.innerHTML = '<h1></h1><pre></pre>';
    panel.querySelector('h1').textContent = title;
    panel.querySelector('pre').textContent = detail || '';
  }
  window.__MINS_FAIL = show;
  if (location.protocol === 'file:') {
    show('请通过本地服务器打开', '浏览器会拦截 file:// 下的 ES 模块。\n运行 npm run dev 后访问 http://127.0.0.1:5173/minsu/index.html');
    return;
  }
  if (!(window.WebGLRenderingContext || window.WebGL2RenderingContext)) {
    show('浏览器没有启用 WebGL', '请打开硬件加速，或换用 Chrome / Edge 最新版。');
    return;
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      show('资源加载失败', (t.src || t.href || '') + '\n检查 public/minsu/vendor/three 是否已生成：npm run build:minsu');
      return;
    }
    show('脚本出错', (e.message || '未知错误') + '\n' + String(e.filename || '').split('/').slice(-1)[0] + ':' + (e.lineno || '?'));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('脚本出错', String((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (window.__MINS_READY) return;
    var diag = '';
    try { if (window.__MINS_DIAG) diag = '\n' + JSON.stringify(window.__MINS_DIAG()); } catch (err) {}
    show('画面没有出现（9 秒超时）', '打开控制台看第一条红色报错。' + diag);
  }, 9000);
})();</script>
<script type="module">import * as THREE from './vendor/three/build/three.module.js';

/* 雨夜 · 民俗街角 —— 三渲二微缩场景
 * 全部程序化建模：没有外部模型与贴图，招牌文字用 canvas 现画。
 * 代码由 build.mjs 按顺序拼接成一个模块：
 *   00 引导 / 10 工具 / 20 街道 / 30 铺子 / 40 街角 / 50 动效与交互
 */

const QS = new URLSearchParams(location.search);
const SKIP_INTRO = QS.has('skip');
const SHOT = QS.has('shot');

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.setClearColor(0x080a11, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0e18, 0.0125);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.08, 400);

/* 自己走时间，避免 THREE.Clock 的弃用提示 */
const timeState = { elapsed: 0, delta: 0 };
let lastFrameTime = performance.now();
function tickTime() {
  const t = performance.now();
  timeState.delta = Math.min((t - lastFrameTime) / 1000, 0.05);
  timeState.elapsed += timeState.delta;
  lastFrameTime = t;
}

/** 全场景共享的 uniform：组装进度、时间、描边宽度 */
const U = {
  time: { value: 0 },
  assemble: { value: 0 },
  outline: { value: 0.032 },
  dpr: { value: Math.min(window.devicePixelRatio || 1, 2) },
};

/** 竖屏时把相机拉远，保证方形底座不被裁掉 */
let fitK = 1;
function resizeNow() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  /* 竖屏横向视野窄：按外接球把相机退到刚好装下（横屏保持定好的机位） */
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  fitK = camera.aspect >= 1 ? 1 : THREE.MathUtils.clamp(16 / Math.sin(hHalf) / 33.5, 1, 3.6);
}
window.addEventListener('resize', resizeNow);
resizeNow();

/* 固定种子随机：每次刷新出来的小件位置都一样，好对比截图 */
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261019);
const rnd = (a = 0, b = 1) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length) % arr.length];

/* ---------- 10 · 配色、材质、招牌图集、合批工具 ---------- */

const PAL = {
  base: 0x26201c, baseTop: 0x1b1a1f, baseEdge: 0x3b322a, brass: 0xc39a55,
  asphalt: 0x2c303b, asphaltDark: 0x232833, roadLine: 0x79827e, curb: 0x857f74,
  walk: 0x6b675f, walkAlt: 0x7a7468, walkDark: 0x565349, gutter: 0x34343a,
  woodDark: 0x32241d, wood: 0x5c4030, woodLight: 0x91704c, woodPale: 0xc79a68,
  plaster: 0xd6c8ae, plasterDeep: 0xb7a68a, brick: 0x7a584c, brickDeep: 0x5f443b,
  tile: 0x2b3140, tileHi: 0x3f4859, tileEdge: 0x515b6d, ridge: 0x353b48,
  paper: 0xf0e2c4, paperWarm: 0xffd79a, lantern: 0xe8603c, lanternDeep: 0xb8402c,
  lamp: 0xffb163, windowLit: 0xffbf78, windowDim: 0x3c2f26,
  glass: 0x9dc6ea, metal: 0x555c67, metalDark: 0x2f353e,
  leaf: 0x365a48, leafHi: 0x4c7659, trunk: 0x4a3a2e,
  cloth: 0x33566e, clothRed: 0xa8352c, jade: 0x4f8577, gold: 0xc99c4e,
  bodyDark: 0x2b2f38, tyre: 0x1d2026, chili: 0xc0392b, corn: 0xd9a94a,
  jar: 0x8a5a3c, ceramic: 0xd8d2c4,
};

/* 四阶灰度渐变：三渲二的分界 */
function gradientTexture() {
  const steps = new Uint8Array([96, 150, 198, 236]);
  const tex = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/* 组装动画：所有零件绕自己的「落点」从地面长出来并上浮 */
const ASSEMBLE_GLSL = `
vec3 assemblePiece(vec3 p, vec3 ground, float d, float prog) {
  float t = clamp((prog - d * 2.2) / 0.34, 0.0, 1.0);
  float e = 1.0 - pow(1.0 - t, 3.0);
  vec3 q = ground + (p - ground) * mix(0.58, 1.0, e);
  q.y += (e - 1.0) * 2.4;
  return q;
}`;

function withAssemble(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uAssemble = U.assemble;
    shader.vertexShader =
      'attribute vec3 aPivot;\nattribute float aDelay;\nuniform float uAssemble;\n' +
      ASSEMBLE_GLSL + '\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      transformed = assemblePiece(transformed, vec3(aPivot.x, 0.0, aPivot.z), aDelay, uAssemble);`
    );
  };
  return mat;
}

const toonMat = withAssemble(new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradientTexture() }));
const glowMat = withAssemble(new THREE.MeshBasicMaterial({ vertexColors: true, fog: true }));
const glassMat = withAssemble(new THREE.MeshBasicMaterial({
  color: 0xa9cdf0, transparent: true, opacity: 0.075, depthWrite: false,
  side: THREE.DoubleSide, fog: true,
}));
const signMat = withAssemble(new THREE.MeshBasicMaterial({
  map: null, vertexColors: true, toneMapped: false, fog: true,
}));

/* 积水：软边暗色水面（比直接画黑椭圆自然） */
const puddleTex = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 6, 64, 64, 62);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.72, 'rgba(255,255,255,0.86)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.beginPath();
  g.arc(64, 64, 63, 0, Math.PI * 2);
  g.fill();
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const puddleMat = withAssemble(new THREE.MeshBasicMaterial({
  map: puddleTex, color: 0x0b1120, transparent: true, opacity: 0.9, depthWrite: false, fog: true,
}));

/* 玻璃上的一道反光 */
const sheenTex = (() => {
  const cv = document.createElement('canvas');
  cv.width = 32; cv.height = 128;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0, 'rgba(220,240,255,0)');
  grd.addColorStop(0.35, 'rgba(220,240,255,0.5)');
  grd.addColorStop(0.55, 'rgba(235,248,255,0.75)');
  grd.addColorStop(1, 'rgba(220,240,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 32, 128);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();
const sheenMat = withAssemble(new THREE.MeshBasicMaterial({
  map: sheenTex, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, fog: true,
}));

/* 描边：反向外壳，在视空间按法线外扩 */
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { uAssemble: U.assemble, uWidth: U.outline, uColor: { value: new THREE.Color(0x11121a) } },
  vertexShader: `
    attribute vec3 aPivot;
    attribute float aDelay;
    uniform float uAssemble;
    uniform float uWidth;
    ${ASSEMBLE_GLSL}
    void main() {
      vec3 p = assemblePiece(position, vec3(aPivot.x, 0.0, aPivot.z), aDelay, uAssemble);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      mv.xyz += n * uWidth;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `uniform vec3 uColor; void main() { gl_FragColor = vec4(uColor, 1.0); }`,
  side: THREE.BackSide,
});

/* ---------- 招牌图集：一块 canvas 画完所有文字，一次绘制 ---------- */
const ATLAS = (() => {
  const SIZE = 1024;
  const cv = document.createElement('canvas');
  cv.width = cv.height = SIZE;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, SIZE, SIZE);

  let cursorX = 0, cursorY = 0, rowH = 0;
  const rects = {};
  function alloc(name, w, h) {
    if (cursorX + w > SIZE) { cursorX = 0; cursorY += rowH; rowH = 0; }
    const r = [cursorX, cursorY, w, h];
    cursorX += w + 4;
    rowH = Math.max(rowH, h);
    rects[name] = [r[0] / SIZE, 1 - (r[1] + h) / SIZE, (r[0] + w) / SIZE, 1 - r[1] / SIZE];
    return r;
  }
  function panel(name, w, h, bg, draw) {
    const [x, y] = alloc(name, w, h);
    g.save();
    g.translate(x, y);
    g.beginPath(); g.rect(0, 0, w, h); g.clip();
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    draw(g, w, h);
    g.restore();
  }
  const FONT = '"STKaiti","KaiTi","Kaiti SC","SimSun","Microsoft YaHei",serif';
  const HEI = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
  function han(ctx, text, x, y, size, color, font = FONT, spacing = 0) {
    ctx.font = `${size}px ${font}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = [...text];
    const total = chars.length * (size + spacing);
    chars.forEach((ch, i) => ctx.fillText(ch, x - total / 2 + (size + spacing) * (i + 0.5), y));
  }
  function vhan(ctx, text, x, y, size, color, gap = 6) {
    ctx.font = `${size}px ${FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    [...text].forEach((ch, i) => ctx.fillText(ch, x, y + i * (size + gap)));
  }
  function frame(ctx, w, h, color, inset, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.strokeRect(inset, inset, w - inset * 2, h - inset * 2);
  }

  /* 匾额 */
  panel('bian', 512, 140, '#2a1c15', (c, w, h) => {
    c.strokeStyle = '#8f7135'; c.lineWidth = 3;
    c.strokeRect(8, 8, w - 16, h - 16);
    c.strokeStyle = '#5c4720'; c.lineWidth = 1;
    c.strokeRect(16, 16, w - 32, h - 32);
    han(c, '拾 遗 阁', w / 2, h / 2 + 2, 74, '#e8c987');
    c.fillStyle = '#9a7a3c';
    c.fillRect(40, h - 30, w - 80, 1.5);
  });

  /* 竖招：民俗 */
  panel('shu', 150, 430, '#241712', (c, w, h) => {
    c.strokeStyle = '#8a6a34'; c.lineWidth = 3;
    c.strokeRect(7, 7, w - 14, h - 14);
    vhan(c, '民俗', w / 2, 92, 66, '#e2c489', 18);
    c.fillStyle = '#7d5c2c'; c.fillRect(38, 210, w - 76, 1.5);
    vhan(c, '剪纸', w / 2 - 30, 250, 26, '#bfa06a', 6);
    vhan(c, '年画', w / 2 + 30, 250, 26, '#bfa06a', 6);
    vhan(c, '泥人', w / 2, 380, 24, '#a8865a', 4);
  });

  /* 街名牌 */
  panel('street', 300, 108, '#1d4a74', (c, w, h) => {
    c.strokeStyle = '#e6eef4'; c.lineWidth = 3;
    c.strokeRect(6, 6, w - 12, h - 12);
    han(c, '拾遗巷', w / 2, h / 2 - 6, 44, '#f2f6f8', FONT, 6);
    c.font = `14px ${HEI}`; c.fillStyle = '#b9d2e4'; c.textAlign = 'center';
    c.fillText('SHIYI  LANE', w / 2, h - 20);
  });

  /* 年画 */
  panel('nianhua', 220, 300, '#a8271f', (c, w, h) => {
    c.strokeStyle = '#e8c06a'; c.lineWidth = 3; c.strokeRect(7, 7, w - 14, h - 14);
    c.fillStyle = '#8e1f1a'; c.beginPath(); c.arc(w / 2, 132, 74, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#e8c06a'; c.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      c.beginPath();
      c.arc(w / 2, 132, 58 - i * 6, 0.5 + i * 0.2, 2.2 + i * 0.2);
      c.stroke();
    }
    c.fillStyle = '#e8c06a';
    c.beginPath(); c.ellipse(w / 2, 128, 34, 15, -0.25, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#a8271f';
    c.beginPath(); c.arc(w / 2 + 22, 124, 4, 0, Math.PI * 2); c.fill();
    vhan(c, '年年有余', w / 2, 232, 30, '#f3d79a', 6);
  });

  /* 福字 */
  panel('fu', 220, 220, '#b32d24', (c, w, h) => {
    c.save(); c.translate(w / 2, h / 2); c.rotate(Math.PI / 4);
    c.strokeStyle = '#e8c06a'; c.lineWidth = 4; c.strokeRect(-78, -78, 156, 156);
    c.restore();
    han(c, '福', w / 2, h / 2 + 4, 120, '#f6dda6');
  });

  /* 价目牌 */
  panel('price', 200, 280, '#d8c49b', (c, w, h) => {
    c.strokeStyle = '#7a5a30'; c.lineWidth = 3; c.strokeRect(6, 6, w - 12, h - 12);
    han(c, '价 目', w / 2, 30, 24, '#3d2a18', FONT, 2);
    const rows = [['糖画', '8'], ['泥人', '25'], ['剪纸', '15'], ['灯笼', '30'], ['年画', '12']];
    rows.forEach(([k, v], i) => {
      const y = 68 + i * 38;
      c.font = `22px ${FONT}`; c.fillStyle = '#33240f'; c.textAlign = 'left';
      c.fillText(k, 22, y);
      c.textAlign = 'right'; c.fillText(`¥${v}`, w - 22, y);
      c.strokeStyle = 'rgba(80,55,25,.35)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(20, y + 10); c.lineTo(w - 20, y + 10); c.stroke();
    });
  });

  /* 营业中 */
  panel('open', 190, 88, '#191a17', (c, w, h) => {
    c.strokeStyle = '#7a2a22'; c.lineWidth = 3; c.strokeRect(5, 5, w - 10, h - 10);
    han(c, '营业中', w / 2, h / 2 + 2, 42, '#e8623f', FONT, 6);
  });

  /* 告示 */
  panel('notice', 240, 190, '#ded0b0', (c, w, h) => {
    c.fillStyle = '#3a3122'; c.font = `bold 20px ${FONT}`; c.textAlign = 'center';
    c.fillText('民俗夜市 告示', w / 2, 34);
    c.strokeStyle = 'rgba(60,48,30,.5)'; c.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      c.beginPath(); c.moveTo(24, 58 + i * 22); c.lineTo(w - 24, 58 + i * 22); c.stroke();
    }
    c.strokeStyle = '#a8382c'; c.lineWidth = 3;
    c.beginPath(); c.arc(w - 40, h - 34, 20, 0, Math.PI * 2); c.stroke();
  });

  /* 底座铭牌 */
  panel('plate', 420, 86, '#241d18', (c, w, h) => {
    c.strokeStyle = '#b08b46'; c.lineWidth = 2; c.strokeRect(6, 6, w - 12, h - 12);
    han(c, '雨 夜 · 民 俗 街 角', w / 2, 32, 30, '#d9b777', FONT, 2);
    c.font = `12px ${HEI}`; c.fillStyle = '#9c7f4e'; c.textAlign = 'center';
    c.fillText('FOLK  CORNER  ·  RAINY  NIGHT', w / 2, 60);
  });

  /* 茶幌 */
  panel('huang', 140, 300, '#2f3d4c', (c, w, h) => {
    c.strokeStyle = '#d8cbb0'; c.lineWidth = 2; c.strokeRect(6, 6, w - 12, h - 12);
    vhan(c, '茶', w / 2, 96, 84, '#efe3c6');
    c.fillStyle = '#efe3c6';
    for (let i = 0; i < 4; i++) c.fillRect(38, 180 + i * 18, w - 76, 2);
  });

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  tex.needsUpdate = true;
  return { tex, rects };
})();
signMat.map = ATLAS.tex;

/* ---------- 合批：所有静态零件按材质装进 4 个桶 ---------- */
const BUCKETS = new Map();
function bucket(name) {
  let b = BUCKETS.get(name);
  if (!b) {
    b = { pos: [], nor: [], uv: [], col: [], piv: [], del: [] };
    BUCKETS.set(name, b);
  }
  return b;
}
let nowDelay = 0;
function layer(d) { nowDelay = d; }

const _col = new THREE.Color();
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();

function addGeo(geo, hex, o = {}) {
  const x = o.x || 0, y = o.y || 0, z = o.z || 0;
  _e.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ');
  _q.setFromEuler(_e);
  _p.set(x, y, z);
  _s.set(o.sx || 1, o.sy || 1, o.sz || 1);
  _m.compose(_p, _q, _s);

  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(_m);
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const thin = Math.min(
    Math.abs(bb.max.x - bb.min.x),
    Math.abs(bb.max.y - bb.min.y),
    Math.abs(bb.max.z - bb.min.z)
  ) < 0.058;
  /* 比描边还细的零件（电线、竹签、栅条）不描边，否则会被墨线糊掉 */
  const b = bucket(o.bucket || (thin ? 'fine' : 'solid'));
  const pa = g.attributes.position.array;
  const na = g.attributes.normal.array;
  const ua = g.attributes.uv ? g.attributes.uv.array : null;

  _col.set(hex);
  if (o.tint) _col.multiply(new THREE.Color(o.tint));
  const jit = o.jitter === false ? 1 : 0.94 + rand() * 0.1;
  const cr = _col.r * jit, cg = _col.g * jit, cb = _col.b * jit;

  const pivot = o.pivot || [x, 0, z];
  const d = o.delay != null ? o.delay : nowDelay;
  const uvR = o.uvRect;
  const n = pa.length / 3;
  for (let i = 0; i < n; i++) {
    b.pos.push(pa[i * 3], pa[i * 3 + 1], pa[i * 3 + 2]);
    b.nor.push(na[i * 3], na[i * 3 + 1], na[i * 3 + 2]);
    if (ua) {
      let u = ua[i * 2], v = ua[i * 2 + 1];
      if (uvR) { u = uvR[0] + u * (uvR[2] - uvR[0]); v = uvR[1] + v * (uvR[3] - uvR[1]); }
      b.uv.push(u, v);
    } else {
      b.uv.push(0, 0);
    }
    b.col.push(cr, cg, cb);
    b.piv.push(pivot[0], pivot[1], pivot[2]);
    b.del.push(d);
  }
  g.dispose();
}

function toGeometry(b) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
  geo.setAttribute('aPivot', new THREE.Float32BufferAttribute(b.piv, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(b.del, 1));
  geo.computeBoundingSphere();
  return geo;
}

/* ---------- 常用体块 ---------- */
const P = {
  box(w, h, d, c, x, y, z, o) { addGeo(new THREE.BoxGeometry(w, h, d), c, { ...o, x, y, z }); },
  box0(w, h, d, c, x, y0, z, o) { this.box(w, h, d, c, x, y0 + h / 2, z, o); },
  cyl(rt, rb, h, c, x, y, z, o, seg = 14) { addGeo(new THREE.CylinderGeometry(rt, rb, h, seg), c, { ...o, x, y, z }); },
  cyl0(rt, rb, h, c, x, y0, z, o, seg = 14) { this.cyl(rt, rb, h, c, x, y0 + h / 2, z, o, seg); },
  sph(r, c, x, y, z, o, ws = 12, hs = 8) { addGeo(new THREE.SphereGeometry(r, ws, hs), c, { ...o, x, y, z }); },
  plane(w, h, c, x, y, z, o) { addGeo(new THREE.PlaneGeometry(w, h), c, { ...o, x, y, z }); },
  torus(r, tube, c, x, y, z, o, rs = 8, ts = 16) {
    addGeo(new THREE.TorusGeometry(r, tube, rs, ts), c, { ...o, x, y, z });
  },
  tube(pts, r, c, o, seg = 40, rad = 5) {

  sign(name, w, h, x, y, z, o = {}) {

      ...o, x, y, z, bucket: 'sign', uvRect: ATLAS.rects[name], jitter: false,

  glowBox(w, h, d, c, x, y, z, o) {
    addGeo(new THREE.BoxGeometry(w, h, d), c, { ...o, x, y, z, bucket: 'glow', jitter: false });

  glowPlane(w, h, c, x, y, z, o) {
    addGeo(new THREE.PlaneGeometry(w, h), c, { ...o, x, y, z, bucket: 'glow', jitter: false });
  },

function finishBucket(name, mat, outline) {
  const b = BUCKETS.get(name);
  if (!b || !b.pos.length) return null;
  const geo = toGeometry(b);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  if (outline) {
    const out = new THREE.Mesh(geo, outlineMat);
    out.frustumCulled = false;
    out.renderOrder = -1;
    mesh.renderOrder = 1;
    worldGroups.add(out);
  }
  worldGroups.add(mesh);
  BUCKETS.delete(name);
  return mesh;
}

function latticeZ(cx, cy, cz, w, h, cols, rows, o = {}) {
  const wood = o.wood || PAL.woodDark;
  const bar = o.bar || 0.045;
  const depth = o.depth || 0.07;
  P.box(w + 0.16, bar * 2.4, depth, wood, cx, cy + h / 2, cz, o);
  P.box(w + 0.16, bar * 2.4, depth, wood, cx, cy - h / 2, cz, o);
  P.box(bar * 2.4, h, depth, wood, cx - w / 2, cy, cz, o);
  P.box(bar * 2.4, h, depth, wood, cx + w / 2, cy, cz, o);
  for (let i = 1; i < cols; i++) {
    P.box(bar, h, depth * 0.8, wood, cx - w / 2 + (w * i) / cols, cy, cz, o);
  }
  for (let i = 1; i < rows; i++) {
    P.box(w, bar, depth * 0.8, wood, cx, cy - h / 2 + (h * i) / rows, cz, o);
  }
}

function latticeX(cx, cy, cz, w, h, cols, rows, o = {}) {
  const wood = o.wood || PAL.woodDark;
  const bar = o.bar || 0.045;
  const depth = o.depth || 0.07;
  P.box(depth, bar * 2.4, w + 0.16, wood, cx, cy + h / 2, cz, o);
  P.box(depth, bar * 2.4, w + 0.16, wood, cx, cy - h / 2, cz, o);
  P.box(depth, h, bar * 2.4, wood, cx, cy, cz - w / 2, o);
  P.box(depth, h, bar * 2.4, wood, cx, cy, cz + w / 2, o);
  for (let i = 1; i < cols; i++) {
    P.box(depth * 0.8, h, bar, wood, cx, cy, cz - w / 2 + (w * i) / cols, o);
  }
  for (let i = 1; i < rows; i++) {
    P.box(depth * 0.8, bar, w, wood, cx, cy - h / 2 + (h * i) / rows, cz, o);
  }
}

let dragging = false;
let lastX = 0, lastY = 0;
let lastInput = -999;
let NOW = 0;
const pointers = new Map();
let pinchDist = 0;

function onPointerDown(e) {
  if (!intro.done) return;
  canvas.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  lastInput = NOW;
  canvas.classList.add('grabbing');
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
}
function onPointerMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInput = NOW;
  if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) {
      cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * (pinchDist / Math.max(d, 1)), 12, 44);
    }
    pinchDist = d;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  cam.goalAz -= dx * 0.0062;
  cam.goalPol = THREE.MathUtils.clamp(cam.goalPol - dy * 0.0048, 0.42, 1.46);
}
function onPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    dragging = false;
    canvas.classList.remove('grabbing');
  }
  pinchDist = 0;
}
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  lastInput = NOW;
  cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * Math.exp(e.deltaY * 0.0011), 12, 44);
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function updateCamera(dt, now) {
  if (!intro.done) {
    intro.t = Math.min(1, intro.t + dt / intro.dur);
    const k = 1 - Math.pow(1 - intro.t, 3);
    cam.az = THREE.MathUtils.lerp(-0.98, cam.goalAz, k);
    cam.pol = THREE.MathUtils.lerp(0.96, cam.goalPol, k);
    cam.dist = THREE.MathUtils.lerp(46, cam.goalDist, k);
    if (intro.t >= 1) intro.done = true;
  } else {
    const idle = now - lastInput > 7 && !dragging;
    if (idle) cam.goalAz += dt * 0.028;
    const k = 1 - Math.exp(-dt * 7.5);
    cam.az += (cam.goalAz - cam.az) * k;
    cam.pol += (cam.goalPol - cam.pol) * k;
    cam.dist += (cam.goalDist - cam.dist) * k;
  }
  const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
  const d = cam.dist * fitK;
  camera.position.set(
    cam.target.x + Math.sin(cam.az) * sp * d,
    cam.target.y + cp * d,
    cam.target.z + Math.cos(cam.az) * sp * d
  );
  camera.lookAt(cam.target);
}

/* ---------- 主循环 ---------- */
let assembleStart = null;
let firstFrame = true;
/* 截图用：?hold=0.4 冻结在组装中途 */
const HOLD = parseFloat(QS.get('hold'));

function animate() {
  requestAnimationFrame(animate);
  tickTime();
  const dt = timeState.delta;
  const now = timeState.elapsed;
  NOW = now;
  U.time.value = now;

  /* 入场：先落底座，再一层层长出来 */
  if (assembleStart == null) assembleStart = now;
  const raw = Number.isFinite(HOLD) ? HOLD : (SKIP_INTRO ? 1 : THREE.MathUtils.clamp((now - assembleStart - 0.9) / 5.4, 0, 1));
  U.assemble.value = raw;
  const lit = Number.isFinite(HOLD) ? THREE.MathUtils.smoothstep(HOLD, 0.12, 0.8) : THREE.MathUtils.smoothstep(raw, 0.12, 0.8);

  moonLight.intensity = 2.3 * lit;
  rimLight.intensity = 1.1 * lit;
  fillLight.intensity = 0.75 * lit;
  lights.interiorA.intensity = 7 * lit;
  lights.interiorB.intensity = 3.2 * lit;
  lights.spill.intensity = 14 * lit;
  lights.lamp.intensity = 24 * lit;
  lights.alley.intensity = 9 * lit;
  lights.stall.intensity = 5 * lit;

  /* 雨 */
  rainMat.opacity = 0.42 * lit;  for (let i = 0; i < RAIN_N; i++) {
    const iy = i * 3 + 1;
    rainPositions[iy] -= rainSpeeds[i] * dt;
    if (rainPositions[iy] < 0.12) {
      if (rand() < 0.22) {
        const x = rainPositions[i * 3], z = rainPositions[i * 3 + 2];
        if (Math.abs(x) < 8.3 && Math.abs(z) < 8.3) {
          rippleAt(x, groundY(x, z), z, rnd(0.6, 1.1), rnd(0.16, 0.3));
        }
      }
      rainSpawn(i, RAIN_TOP + rnd(0, 1.5));
    }
  }
  rainGeo.attributes.position.needsUpdate = true;

  /* 涟漪 */
  for (const m of ripples) {
    if (!m.visible) continue;
    const u = m.userData;
    u.t += dt;
    const k = u.t / u.ttl;
    if (k >= 1) { m.visible = false; continue; }
    const s = u.size * (0.4 + k * 2.4);
    m.scale.set(s, s, 1);
    m.material.opacity = (1 - k) * 0.22;
  }

  /* 檐口滴水 */
  dripTimer -= dt;
  if (dripTimer < 0) {
    dripTimer = rnd(0.25, 0.9);
    const d = drips.find((m) => !m.visible);
    if (d) {
      d.visible = true;
      d.userData.t = 0;
      d.userData.ttl = 0.52;
      d.userData.x = rnd(-3.3, 4.1);
      d.userData.y = 3.1;
      d.userData.z = rnd(2.05, 2.2);
      d.position.set(d.userData.x, d.userData.y, d.userData.z);
    }
  }
  for (const d of drips) {
    if (!d.visible) continue;
    const u = d.userData;
    u.t += dt;
    if (u.t >= u.ttl) {
      d.visible = false;
      rippleAt(u.x, SITE.walkY, u.z, 0.6, 0.12);
      continue;
    }
    d.position.y = u.y - 8.5 * u.t * u.t;
    d.scale.y = 1 + u.t * 2.2;
  }

  /* 热气 */
  for (let i = 0; i < STEAM_N; i++) {
    steamPos[i * 3 + 1] += dt * (0.22 + steamSeed[i] * 0.22);
    steamPos[i * 3] += Math.sin(now * 0.7 + i) * dt * 0.05;
    if (steamPos[i * 3 + 1] > 2.95) {
      steamPos[i * 3] = -2.35 + rnd(-0.16, 0.16);
      steamPos[i * 3 + 1] = 1.4;
      steamPos[i * 3 + 2] = -0.3 + rnd(-0.14, 0.14);
    }
  }
  steamGeo.attributes.position.needsUpdate = true;
  steam.material.opacity = 0.15 * lit;

  /* 光晕：轻微呼吸 + 招牌偶尔闪一下 */
  for (const s of glowSprites) {
    let o = s.userData.base * (0.86 + 0.14 * Math.sin(now * s.userData.speed + s.userData.phase));
    if (s.userData.flicker) {
      const f = Math.sin(now * 0.9) + Math.sin(now * 2.3 + 1.2) * 0.5;
      if (f < -1.15) o *= 0.55;
    }
    s.material.opacity = o * lit;
  }
  for (const p of pools) p.material.opacity = p.userData.base * lit * (0.9 + 0.1 * Math.sin(now * 1.7));

  /* 布帘与风车 */
  if (curtain) curtain.rotation.z = Math.sin(now * 1.15) * 0.035 + Math.sin(now * 2.7) * 0.012;
  if (mill) mill.rotation.z = now * 1.4;

  updateCamera(dt, now);

  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const boot = document.getElementById('boot');
    if (boot) {
      if (SHOT) boot.style.display = 'none';
      else boot.classList.add('gone');
    }
    window.__MINS_READY = true;
  }
}

window.__MINS_DIAG = () => {
  let dmin = 9, dmax = -9;
  const g = worldGroups.children.find((c) => c.isMesh && c.geometry.attributes.aDelay);
  if (g) {
    const a = g.geometry.attributes.aDelay.array;
    for (let i = 0; i < a.length; i += 97) { dmin = Math.min(dmin, a[i]); dmax = Math.max(dmax, a[i]); }
  }
  return {
    assemble: +U.assemble.value.toFixed(3),
    delay: [+dmin.toFixed(2), +dmax.toFixed(2)],
    drawCalls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
    camera: [cam.az, cam.pol, cam.dist].map((v) => +v.toFixed(2)),
  };
};
window.__MINS = {
  scene, camera, renderer, cam,
  setView(az, pol, dist) {
    intro.done = true;
    cam.goalAz = cam.az = az;
    cam.goalPol = cam.pol = pol;
    cam.goalDist = cam.dist = dist;
    updateCamera(0, timeState.elapsed);
  },
  finish() { U.assemble.value = 1; },
};

animate();
</script>
