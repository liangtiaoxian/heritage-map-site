<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07080e" />
<title>民俗老街 · 白天</title>
<style>html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #dbe7ed;
}

body {
  /* 无 UI：整屏只有 canvas，背景只做一层天光渐变 */
  background:
    radial-gradient(125% 95% at 50% 6%, #f0f7fa 0%, #dbe8ee 46%, #bfd1da 100%);
  cursor: grab;
}

canvas#scene {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

canvas.grabbing { cursor: grabbing; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(74% 64% at 50% 46%, rgba(0, 0, 0, 0) 58%, rgba(64, 86, 98, 0.16) 100%);
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #4d5a62;
  font: 500 15px/1.7 "Songti SC", "SimSun", "Microsoft YaHei", serif;
  letter-spacing: 0.22em;
  background: #eef4f6;
  transition: opacity 0.9s ease, visibility 0.9s;
  z-index: 10;
}

#boot span { font-size: 20px; letter-spacing: 0.34em; color: #33424a; }
#boot i { font-style: normal; font-size: 12px; color: #7e8a90; letter-spacing: 0.3em; }
#boot.gone { opacity: 0; visibility: hidden; }

#boot.error {
  align-items: flex-start;
  padding: 8vh 9vw;
  letter-spacing: normal;
  font-family: "Microsoft YaHei", sans-serif;
  background: #2b3238;
  color: #dfe7ea;
}
#boot.error h1 { font-size: 18px; color: #ffb4a0; margin: 0 0 12px; }
#boot.error pre { white-space: pre-wrap; font-size: 13px; color: #c9d2d6; max-width: 760px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="boot"><span>民 俗 老 街</span><i>正在搭起街市</i></div>
<script>(function () {
  var panel = document.getElementById('boot');
  var booted = false;
  function show(title, detail) {
    if (booted) return;
    booted = true;
    panel.className = 'error';
    panel.innerHTML = '<h1></h1><pre></pre>';
    panel.querySelector('h1').textContent = title;
    panel.querySelector('pre').textContent = detail || '';
  }
  window.__MINS_FAIL = show;
  if (location.protocol === 'file:') {
    show('请通过本地服务器打开', '浏览器会拦截 file:// 下的 ES 模块。\n运行 npm run dev 后访问 http://127.0.0.1:5173/minsu/index.html');
    return;
  }
  if (!(window.WebGLRenderingContext || window.WebGL2RenderingContext)) {
    show('浏览器没有启用 WebGL', '请打开硬件加速，或换用 Chrome / Edge 最新版。');
    return;
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      show('资源加载失败', (t.src || t.href || '') + '\n检查 public/minsu/vendor/three 是否已生成：npm run build:minsu');
      return;
    }
    show('脚本出错', (e.message || '未知错误') + '\n' + String(e.filename || '').split('/').slice(-1)[0] + ':' + (e.lineno || '?'));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('脚本出错', String((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (window.__MINS_READY) return;
    var diag = '';
    try { if (window.__MINS_DIAG) diag = '\n' + JSON.stringify(window.__MINS_DIAG()); } catch (err) {}
    show('画面没有出现（9 秒超时）', '打开控制台看第一条红色报错。' + diag);
  }, 9000);
})();</script>
<script type="module">import * as THREE from './vendor/three/build/three.module.js';

/* 民俗老街 · 白天 —— 三渲二微缩街景
 * 全部程序化建模：没有外部模型与贴图，招牌文字用 canvas 现画。
 * 代码由 build.mjs 按顺序拼接成一个模块：
 *   00 引导 / 10 工具 / 20 街面 / 30 铺子 / 40 街角 / 50 动效与交互
 */

const QS = new URLSearchParams(location.search);
const SKIP_INTRO = QS.has('skip');
const SHOT = QS.has('shot');

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.setClearColor(0xdbe6ea, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
/* 白天的空气透视：远处淡淡退到天光里 */
scene.fog = new THREE.FogExp2(0xdde8ec, 0.0075);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 400);

/** 全场景共享的 uniform：组装进度、时间、描边宽度 */
const U = {
  time: { value: 0 },
  assemble: { value: 0 },
  outline: { value: 0.026 },
  dpr: { value: Math.min(window.devicePixelRatio || 1, 2) },
};

/** 竖屏时把相机拉远，保证长条底座不被裁掉 */
let fitK = 1;
function resizeNow() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const vHalf = THREE.MathUtils.degToRad(camera.fov / 2);
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  fitK = camera.aspect >= 1 ? 1 : THREE.MathUtils.clamp(18 / Math.sin(hHalf) / 54, 1, 3.6);
  /* 竖屏要退得很远，雾密度按比例降下来，不然整条街会糊成一片白 */
  if (scene.fog) scene.fog.density = 0.0075 / Math.max(1, fitK);
}
window.addEventListener('resize', resizeNow);
resizeNow();

/* 自己走时间，避免 THREE.Clock 的弃用提示 */
const timeState = { elapsed: 0, delta: 0 };
let lastFrameTime = performance.now();
function tickTime() {
  const t = performance.now();
  timeState.delta = Math.min((t - lastFrameTime) / 1000, 0.05);
  timeState.elapsed += timeState.delta;
  lastFrameTime = t;
}

/* 固定种子随机：每次刷新出来的小件位置都一样，好对比截图 */
function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261019);
const rnd = (a = 0, b = 1) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length) % arr.length];

/* ---------- 10 · 配色、材质、招牌图集、合批工具 ---------- */

const PAL = {
  base: 0x453528, baseTop: 0x2a211a, baseEdge: 0x564433, brass: 0xc4a05a,
  road: 0x9ba0a2, roadDark: 0x84898c, roadJoint: 0x6f7578, curb: 0xb5b1a4,
  walk: 0xa9a59a, walkAlt: 0xb4afa2, walkDark: 0x8d897d, gutter: 0x6d7274,
  soil: 0x8c806c, moss: 0x6f8256,
  woodDark: 0x4a3227, wood: 0x7a5236, woodLight: 0xa87a4e, woodPale: 0xc59a68,
  plaster: 0xf0e8d6, plasterDeep: 0xd9cdb6, wallOchre: 0xd9c39a, brick: 0x9c6a54,
  tile: 0x596372, tileHi: 0x6d788a, tileEdge: 0x7e8a9c, ridge: 0x48505f,
  paper: 0xf4e8cf, paperWarm: 0xffe0a8, red: 0xc23a2c, redDeep: 0x97291f,
  ochre: 0xd9a24a, jade: 0x5b8a72, indigo: 0x3f5f80, cream: 0xf3e6c8,
  leaf: 0x4f7a45, leafHi: 0x6f9d55, trunk: 0x5a4331,
  lantern: 0xd8432e, metal: 0x6a7078, metalDark: 0x3e434a,
  bamboo: 0xc7a46c, bambooDark: 0x9c7f4e, cloth: 0x6f8fa8, clothRed: 0xa8352c,
  chili: 0xc0392b, corn: 0xd9a94a, ceramic: 0xe2dccd, ink: 0x2c2a26,
};

/* 四阶灰度渐变：三渲二的分界（白天整体提亮） */
function gradientTexture() {
  const steps = new Uint8Array([150, 202, 236, 255]);
  const tex = new THREE.DataTexture(steps, steps.length, 1, THREE.RedFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  tex.needsUpdate = true;
  return tex;
}

/* 组装动画：所有零件绕自己的「落点」从地面长出来并上浮 */
const ASSEMBLE_GLSL = `
vec3 assemblePiece(vec3 p, vec3 ground, float d, float prog) {
  float t = clamp((prog - d * 2.2) / 0.34, 0.0, 1.0);
  float e = 1.0 - pow(1.0 - t, 3.0);
  vec3 q = ground + (p - ground) * mix(0.72, 1.0, e);
  q.y += (e - 1.0) * 0.85;
  return q;
}`;

function withAssemble(mat) {
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uAssemble = U.assemble;
    shader.vertexShader =
      'attribute vec3 aPivot;\nattribute float aDelay;\nuniform float uAssemble;\n' +
      ASSEMBLE_GLSL + '\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
      transformed = assemblePiece(transformed, vec3(aPivot.x, 0.0, aPivot.z), aDelay, uAssemble);`
    );
  };
  return mat;
}

const toonMat = withAssemble(new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradientTexture() }));
const glowMat = withAssemble(new THREE.MeshBasicMaterial({ vertexColors: true, fog: true }));
const glassMat = withAssemble(new THREE.MeshBasicMaterial({
  color: 0xdbeefc, transparent: true, opacity: 0.1, depthWrite: false,
  side: THREE.DoubleSide, fog: true,
}));
const signMat = withAssemble(new THREE.MeshBasicMaterial({
  map: null, vertexColors: true, toneMapped: false, fog: true,
}));
const sheenMat = withAssemble(new THREE.MeshBasicMaterial({
  map: null, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, fog: true,
}));

/* 描边：反向外壳，在视空间按法线外扩 */
const outlineMat = new THREE.ShaderMaterial({
  uniforms: { uAssemble: U.assemble, uWidth: U.outline, uColor: { value: new THREE.Color(0x33302a) } },
  vertexShader: `
    attribute vec3 aPivot;
    attribute float aDelay;
    uniform float uAssemble;
    uniform float uWidth;
    ${ASSEMBLE_GLSL}
    void main() {
      vec3 p = assemblePiece(position, vec3(aPivot.x, 0.0, aPivot.z), aDelay, uAssemble);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vec3 n = normalize(normalMatrix * normal);
      mv.xyz += n * uWidth;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `uniform vec3 uColor; void main() { gl_FragColor = vec4(uColor, 1.0); }`,
  side: THREE.BackSide,
});

/* 阴影用的深度材质：必须和主材质有同一套组装变形，否则投影会「提前组装好」 */
const depthMat = withAssemble(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }));

/* ---------- 招牌图集：一块 canvas 画完所有文字，一次绘制 ---------- */
const ATLAS = (() => {
  const W = 1024, H = 2048;
  const cv = document.createElement('canvas');
  cv.width = W;
  cv.height = H;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, W, H);

  let cursorX = 0, cursorY = 0, rowH = 0;
  const rects = {};
  function alloc(name, w, h) {
    if (cursorX + w > W) { cursorX = 0; cursorY += rowH; rowH = 0; }
    const r = [cursorX, cursorY, w, h];
    cursorX += w + 4;
    rowH = Math.max(rowH, h);
    rects[name] = [r[0] / W, 1 - (r[1] + h) / H, (r[0] + w) / W, 1 - r[1] / H];
    return r;
  }
  function panel(name, w, h, bg, draw) {
    const [x, y] = alloc(name, w, h);
    g.save();
    g.translate(x, y);
    g.beginPath(); g.rect(0, 0, w, h); g.clip();
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    draw(g, w, h);
    g.restore();
  }
  const KAI = '"STKaiti","KaiTi","Kaiti SC","SimSun","Microsoft YaHei",serif';
  const HEI = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
  function han(ctx, text, x, y, size, color, font = KAI, spacing = 0) {
    ctx.font = `${size}px ${font}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const chars = [...text];
    const total = chars.length * (size + spacing);
    chars.forEach((ch, i) => ctx.fillText(ch, x - total / 2 + (size + spacing) * (i + 0.5), y));
  }
  function vhan(ctx, text, x, y, size, color, gap = 6) {
    ctx.font = `${size}px ${KAI}`;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    [...text].forEach((ch, i) => ctx.fillText(ch, x, y + i * (size + gap)));
  }

  /* 布幌：竖向字，布底红边 */
  function banner(name, text, sub) {
    panel(name, 110, 260, '#f2e4c6', (c, w, h) => {
      c.fillStyle = '#c23a2c';
      c.fillRect(0, 0, w, 16);
      c.fillRect(0, h - 26, w, 26);
      c.strokeStyle = '#b8332a'; c.lineWidth = 3;
      c.strokeRect(7, 22, w - 14, h - 54);
      vhan(c, text, w / 2, 62, 46, '#a52c22', 10);
      if (sub) {
        c.font = `13px ${HEI}`; c.fillStyle = '#8a5a3c'; c.textAlign = 'center';
        c.fillText(sub, w / 2, h - 40);
      }
      c.fillStyle = '#7a2a20';
      c.fillRect(w / 2 - 12, 0, 24, 8);
    });
  }
  /* 横匾：黑漆金字（去掉空格，按字数自动收字号，避免首尾字被裁） */
  function plaque(name, text) {
    panel(name, 300, 86, '#2b1e17', (c, w, h) => {
      c.strokeStyle = '#c8a75e'; c.lineWidth = 3;
      c.strokeRect(7, 7, w - 14, h - 14);
      const t = text.replace(/\s+/g, '');
      const size = t.length >= 4 ? 38 : 46;
      han(c, t, w / 2, h / 2 + 2, size, '#e8c987', KAI, 6);
    });
  }

  /* 戏台楹联：红底金字，竖着写 */
  function couplet(name, text) {
    panel(name, 74, 300, '#a8261e', (c, w, h) => {
      c.strokeStyle = '#e8c06a'; c.lineWidth = 3;
      c.strokeRect(5, 5, w - 10, h - 10);
      vhan(c, text, w / 2, 42, 42, '#f4dda6', 10);
    });
  }
  couplet('duiA', '戏台小天地');
  couplet('duiB', '天地大戏台');

  banner('bCha', '茶', '茶馆');
  banner('bJian', '剪纸', '窗花');
  banner('bNian', '年画', '木版');
  banner('bDeng', '灯笼', '纸扎');
  banner('bPi', '皮影', '影戏');
  banner('bZhu', '竹器', '篾匠');
  banner('bFruit', '水果', '时鲜');
  banner('bKite', '风筝', '纸鸢');
  banner('bTang', '糖葫芦', '冰糖');
  banner('bYao', '药材', '草药');
  banner('bJiu', '酒', '陈酿');
  banner('bMian', '面', '汤面');
  banner('bKe', '客栈', '住宿');
  banner('bChi', '小吃', '庙会');
  banner('bXiang', '香烛', '香火');
  banner('bTangHua', '糖画', '糖人');
  banner('bNi', '泥人', '面人');

  plaque('pCha', '茶 楼');
  plaque('pJian', '剪 纸 坊');
  plaque('pNian', '年 画 坊');
  plaque('pDeng', '灯 笼 铺');
  plaque('pPi', '皮 影 戏');
  plaque('pZhu', '竹 器 铺');
  plaque('pStage', '庙 会 戏 台');
  plaque('pMiao', '土 地 庙');
  plaque('pYao', '药 铺');
  plaque('pJiu', '酒 坊');
  plaque('pMian', '面 馆');
  plaque('pGate', '民 俗 老 街');
  plaque('pKe', '客 栈');

  /* ---- 坎儿井剖面沙盘用的几块牌子 ---- */
  plaque('pKarez', '坎 儿 井');
  plaque('pLaoba', '涝 坝');
  plaque('pWei', '竖 井');
  banner('bPu', '葡萄', '晾房');
  banner('bGua', '瓜果', '甜');
  panel('kplate', 460, 92, '#2a211a', (c, w, h) => {
    c.strokeStyle = '#b08b46'; c.lineWidth = 2; c.strokeRect(6, 6, w - 12, h - 12);
    han(c, '坎 儿 井', w / 2, 34, 32, '#d9b777', KAI, 4);
    c.font = `12px ${HEI}`; c.fillStyle = '#9c7f4e'; c.textAlign = 'center';
    c.fillText('KAREZ  ·  SECTION  MODEL', w / 2, 66);
  });
  panel('knotice', 250, 180, '#e0d3b4', (c, w, h) => {
    c.fillStyle = '#3a3122'; c.font = `bold 21px ${KAI}`; c.textAlign = 'center';
    c.fillText('坎 儿 井', w / 2, 34);
    c.font = `14px ${HEI}`; c.fillStyle = '#5a4a33';
    c.fillText('天山雪水 · 地下引渠', w / 2, 60);
    c.strokeStyle = 'rgba(60,48,30,.45)'; c.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      c.beginPath(); c.moveTo(24, 88 + i * 22); c.lineTo(w - 24, 88 + i * 22); c.stroke();
    }
  });

  /* 年画 */
  panel('nianhua', 200, 270, '#a8271f', (c, w, h) => {
    c.strokeStyle = '#e8c06a'; c.lineWidth = 3; c.strokeRect(7, 7, w - 14, h - 14);
    c.fillStyle = '#8e1f1a'; c.beginPath(); c.arc(w / 2, 118, 66, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#e8c06a'; c.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      c.beginPath(); c.arc(w / 2, 118, 52 - i * 5, 0.5 + i * 0.2, 2.2 + i * 0.2); c.stroke();
    }
    c.fillStyle = '#e8c06a';
    c.beginPath(); c.ellipse(w / 2, 114, 30, 13, -0.25, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#a8271f';
    c.beginPath(); c.arc(w / 2 + 20, 110, 4, 0, Math.PI * 2); c.fill();
    vhan(c, '年年有余', w / 2, 205, 27, '#f3d79a', 5);
  });

  /* 福字 */
  panel('fu', 190, 190, '#b32d24', (c, w, h) => {
    c.save(); c.translate(w / 2, h / 2); c.rotate(Math.PI / 4);
    c.strokeStyle = '#e8c06a'; c.lineWidth = 4; c.strokeRect(-66, -66, 132, 132);
    c.restore();
    han(c, '福', w / 2, h / 2 + 4, 104, '#f6dda6');
  });

  /* 价目牌 */
  panel('price', 190, 250, '#d8c49b', (c, w, h) => {
    c.strokeStyle = '#7a5a30'; c.lineWidth = 3; c.strokeRect(6, 6, w - 12, h - 12);
    han(c, '价 目', w / 2, 28, 22, '#3d2a18', KAI, 2);
    const rows = [['茶', '3'], ['剪纸', '5'], ['年画', '8'], ['灯笼', '12'], ['竹篮', '15']];
    rows.forEach(([k, v], i) => {
      const y = 66 + i * 34;
      c.font = `20px ${KAI}`; c.fillStyle = '#33240f'; c.textAlign = 'left';
      c.fillText(k, 20, y);
      c.textAlign = 'right'; c.fillText(`¥${v}`, w - 20, y);
      c.strokeStyle = 'rgba(80,55,25,.35)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(18, y + 9); c.lineTo(w - 18, y + 9); c.stroke();
    });
  });

  /* 告示 */
  panel('notice', 230, 170, '#ded0b0', (c, w, h) => {
    c.fillStyle = '#3a3122'; c.font = `bold 19px ${KAI}`; c.textAlign = 'center';
    c.fillText('民 俗 老 街', w / 2, 32);
    c.strokeStyle = 'rgba(60,48,30,.5)'; c.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      c.beginPath(); c.moveTo(22, 56 + i * 24); c.lineTo(w - 22, 56 + i * 24); c.stroke();
    }
    c.strokeStyle = '#a8382c'; c.lineWidth = 3;
    c.beginPath(); c.arc(w - 36, h - 32, 18, 0, Math.PI * 2); c.stroke();
  });

  /* 底座铭牌 */
  panel('plate', 420, 86, '#2a211a', (c, w, h) => {
    c.strokeStyle = '#b08b46'; c.lineWidth = 2; c.strokeRect(6, 6, w - 12, h - 12);

/* ---------- 合批：所有静态零件按材质装进 4 个桶 ---------- */
const BUCKETS = new Map();
function bucket(name) {
  let b = BUCKETS.get(name);
  if (!b) {
    b = { pos: [], nor: [], uv: [], col: [], piv: [], del: [] };
    BUCKETS.set(name, b);
  }
  return b;
}
let nowDelay = 0;
function layer(d) { nowDelay = d; }

const _col = new THREE.Color();
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();

/* 整块内容沿街平移用：设 OX 后，接下来 addGeo 的 x 全部加上这个偏移 */
let OX = 0;

function addGeo(geo, hex, o = {}) {
  const x = (o.x || 0) + OX, y = o.y || 0, z = o.z || 0;
  _e.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ');
  _q.setFromEuler(_e);
  _p.set(x, y, z);
  _s.set(o.sx || 1, o.sy || 1, o.sz || 1);
  _m.compose(_p, _q, _s);

  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(_m);
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const thin = Math.min(
    Math.abs(bb.max.x - bb.min.x),
    Math.abs(bb.max.y - bb.min.y),
    Math.abs(bb.max.z - bb.min.z)
  ) < 0.058;
  /* 比描边还细的零件（电线、竹签、栅条）不描边，否则会被墨线糊掉 */
  const b = bucket(o.bucket || (thin ? 'fine' : 'solid'));
  const pa = g.attributes.position.array;
  const na = g.attributes.normal.array;
  const ua = g.attributes.uv ? g.attributes.uv.array : null;

  _col.set(hex);
  if (o.tint) _col.multiply(new THREE.Color(o.tint));
  const jit = o.jitter === false ? 1 : 0.95 + rand() * 0.08;
  const cr = _col.r * jit, cg = _col.g * jit, cb = _col.b * jit;

  const pivot = o.pivot ? [o.pivot[0] + OX, o.pivot[1], o.pivot[2]] : [x, 0, z];
  const d = o.delay != null ? o.delay : nowDelay;
  const uvR = o.uvRect;
  const n = pa.length / 3;
  for (let i = 0; i < n; i++) {
    b.pos.push(pa[i * 3], pa[i * 3 + 1], pa[i * 3 + 2]);
    b.nor.push(na[i * 3], na[i * 3 + 1], na[i * 3 + 2]);
    if (ua) {
      let u = ua[i * 2], v = ua[i * 2 + 1];
      if (uvR) { u = uvR[0] + u * (uvR[2] - uvR[0]); v = uvR[1] + v * (uvR[3] - uvR[1]); }
      b.uv.push(u, v);
    } else {
      b.uv.push(0, 0);
    }
    b.col.push(cr, cg, cb);
    b.piv.push(pivot[0], pivot[1], pivot[2]);
    b.del.push(d);
  }
  g.dispose();
}

function toGeometry(b) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
  geo.setAttribute('aPivot', new THREE.Float32BufferAttribute(b.piv, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(b.del, 1));
  geo.computeBoundingSphere();
  return geo;
}

/* ---------- 常用体块 ---------- */
const P = {
  box(w, h, d, c, x, y, z, o) { addGeo(new THREE.BoxGeometry(w, h, d), c, { ...o, x, y, z }); },
  box0(w, h, d, c, x, y0, z, o) { this.box(w, h, d, c, x, y0 + h / 2, z, o); },
  cyl(rt, rb, h, c, x, y, z, o, seg = 14) { addGeo(new THREE.CylinderGeometry(rt, rb, h, seg), c, { ...o, x, y, z }); },
  cyl0(rt, rb, h, c, x, y0, z, o, seg = 14) { this.cyl(rt, rb, h, c, x, y0 + h / 2, z, o, seg); },
  sph(r, c, x, y, z, o, ws = 12, hs = 8) { addGeo(new THREE.SphereGeometry(r, ws, hs), c, { ...o, x, y, z }); },
  plane(w, h, c, x, y, z, o) { addGeo(new THREE.PlaneGeometry(w, h), c, { ...o, x, y, z }); },
  torus(r, tube, c, x, y, z, o, rs = 8, ts = 16) {
    addGeo(new THREE.TorusGeometry(r, tube, rs, ts), c, { ...o, x, y, z });
  },
  tube(pts, r, c, o, seg = 40, rad = 5) {
    const curve = new THREE.CatmullRomCurve3(pts.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
    addGeo(new THREE.TubeGeometry(curve, seg, r, rad, false), c, o || {});
  },
  sign(name, w, h, x, y, z, o = {}) {
    addGeo(new THREE.PlaneGeometry(w, h), o.color || 0xffffff, {
      ...o, x, y, z, bucket: 'sign', uvRect: ATLAS.rects[name], jitter: false,
    });
  },
  glowBox(w, h, d, c, x, y, z, o) {
    addGeo(new THREE.BoxGeometry(w, h, d), c, { ...o, x, y, z, bucket: 'glow', jitter: false });
  },
  glowPlane(w, h, c, x, y, z, o) {
    addGeo(new THREE.PlaneGeometry(w, h), c, { ...o, x, y, z, bucket: 'glow', jitter: false });
  },
  glassPlane(w, h, x, y, z, o) {
    addGeo(new THREE.PlaneGeometry(w, h), 0xdff0ff, { ...o, x, y, z, bucket: 'glass', jitter: false });
  },
  glass(w, h, d, x, y, z, o) {
    addGeo(new THREE.BoxGeometry(w, h, d), 0xdff0ff, { ...o, x, y, z, bucket: 'glass', jitter: false });
  },
};

/** 需要加光晕 sprites 的位置：[x, y, z, size, color, opacity] */
const glowPts = [];

function finishBucket(name, mat, outline) {
  const b = BUCKETS.get(name);
  if (!b || !b.pos.length) return null;
  const geo = toGeometry(b);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  if (!QS.has('nodepth')) mesh.customDepthMaterial = depthMat;
  if (outline) {
    const out = new THREE.Mesh(geo, outlineMat);
    out.frustumCulled = false;
    out.castShadow = false;
    out.receiveShadow = false;
    out.renderOrder = -1;
    mesh.renderOrder = 1;
    worldGroups.add(out);
  }
  worldGroups.add(mesh);
  BUCKETS.delete(name);
  return mesh;
}

const ST = {
  zFront: -3.4,
  zBack: -7.3,
  floorY: 0.3,
  eaveOut: 0.62,
};

function tiledRoof(cx, xw, zFront, zBack, yEave, rise) {
  const zf = zFront + ST.eaveOut;
  const zb = zBack - ST.eaveOut;
  const zc = (zf + zb) / 2;
  const half = (zf - zc);
  const ang = Math.atan2(rise, half);
  const len = Math.hypot(half, rise) + 0.1;
  const yMid = yEave + rise / 2;
  P.box(xw, 0.13, len, PAL.tile, cx, yMid, (zf + zc) / 2, { rx: ang, jitter: false });
  P.box(xw, 0.13, len, PAL.tile, cx, yMid, (zb + zc) / 2, { rx: -ang, jitter: false });
  /* 瓦垄 */
  for (let i = 0; i < 7; i++) {
    const t = i / 6;
    const yf = yEave + t * rise + 0.07;
    const zF = zf + t * (zc - zf);
    P.box(xw, 0.05, 0.1, i % 2 ? PAL.tileHi : PAL.tile, cx, yf, zF, { rx: ang, jitter: false });
    const zB = zb + t * (zc - zb);
    P.box(xw, 0.05, 0.1, i % 2 ? PAL.tileHi : PAL.tile, cx, yf, zB, { rx: -ang, jitter: false });
  }
  /* 檐板 + 瓦当 + 正脊 */
  P.box(xw + 0.06, 0.15, 0.14, PAL.woodDark, cx, yEave - 0.02, zf, { jitter: false });
  P.box(xw + 0.06, 0.15, 0.14, PAL.woodDark, cx, yEave - 0.02, zb, { jitter: false });
  for (let x = cx - xw / 2 + 0.2; x < cx + xw / 2; x += 0.24) {
    P.cyl(0.055, 0.055, 0.07, PAL.tileEdge, x, yEave - 0.04, zf + 0.06, { rx: Math.PI / 2, jitter: false }, 7);
  }
  P.box(xw + 0.1, 0.18, 0.26, PAL.ridge, cx, yEave + rise + 0.04, zc, { jitter: false });
  for (const s of [-1, 1]) {
    P.box(0.14, 0.34, 0.24, PAL.ridge, cx + s * (xw / 2), yEave + rise + 0.14, zc, { rz: s * 0.3, jitter: false });
  }
}

}

/* 木格窗（朝街） */
function latticeZ(cx, cy, cz, w, h, cols, rows, o = {}) {
  const wood = o.wood || PAL.woodDark;
  const bar = o.bar || 0.045;
  const depth = o.depth || 0.07;
  P.box(w + 0.16, bar * 2.4, depth, wood, cx, cy + h / 2, cz, o);
  P.box(w + 0.16, bar * 2.4, depth, wood, cx, cy - h / 2, cz, o);
  P.box(bar * 2.4, h, depth, wood, cx - w / 2, cy, cz, o);
  P.box(bar * 2.4, h, depth, wood, cx + w / 2, cy, cz, o);
  for (let i = 1; i < cols; i++) P.box(bar, h, depth * 0.8, wood, cx - w / 2 + (w * i) / cols, cy, cz, o);
  for (let i = 1; i < rows; i++) P.box(w, bar, depth * 0.8, wood, cx, cy - h / 2 + (h * i) / rows, cz, o);
}

/* 悬挂布幌 / 横匾 */
function hangingBanner(slot, x, y, z, w = 0.46, h = 1.1, faceX = false) {
  P.box(faceX ? 0.05 : 0.05, 0.05, faceX ? 0.6 : 0.05, PAL.woodDark, x, y + h / 2 + 0.16, z);
  P.box(faceX ? 0.06 : 0.5, 0.04, faceX ? 0.5 : 0.06, PAL.woodDark, x, y - h / 2 - 0.02, z, { jitter: false });
  if (faceX) {
    P.sign(slot, w, h, x - 0.035, y, z, { ry: -Math.PI / 2, delay: nowDelay + 0.02 });
    P.sign(slot, w, h, x + 0.035, y, z, { ry: Math.PI / 2, delay: nowDelay + 0.02 });
  } else {
    P.sign(slot, w, h, x, y, z + 0.035, { delay: nowDelay + 0.02 });
    P.sign(slot, w, h, x, y, z - 0.035, { ry: Math.PI, delay: nowDelay + 0.02 });
  }
  P.box(0.03, 0.22, 0.03, PAL.red, x, y + h / 2 + 0.06, z, { jitter: false });
}

function plaque(slot, x, y, z, w = 2.2, h = 0.6) {
  P.box(w + 0.18, h + 0.14, 0.09, PAL.woodDark, x, y, z);
  P.sign(slot, w, h, x, y, z + 0.06, { delay: nowDelay + 0.03 });
  P.box(w + 0.24, 0.05, 0.12, PAL.brass, x, y + h / 2 + 0.1, z + 0.02, { jitter: false });
}

/* 柜台 + 台面小件 */
function counter(x, z, w, d = 0.5, h = 0.95, c = PAL.wood) {
  P.box(w, h, d, c, x, ST.floorY + h / 2, z);
  P.box(w + 0.08, 0.07, d + 0.08, PAL.woodLight, x, ST.floorY + h + 0.02, z);
  P.box(w, 0.5, 0.04, 0x5a3a28, x, ST.floorY + 0.3, z + d / 2 + 0.01);
  for (let i = 0; i < 4; i++) {
    P.box(w / 5, 0.42, 0.03, 0x6a4630, x - w / 2 + w / 10 + (i * w) / 4.5, ST.floorY + 0.28, z + d / 2 + 0.03, { jitter: false });
  }
}

function table(x, z, w, d, h, c = PAL.wood) {
  P.box(w, 0.08, d, c, x, ST.floorY + h, z);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    P.box(0.07, h, 0.07, PAL.woodDark, x + (sx * (w / 2 - 0.1)), ST.floorY + h / 2, z + sz * (d / 2 - 0.1));
  }
}

function stool(x, z, ry = 0) {
  P.box(0.34, 0.06, 0.26, PAL.wood, x, ST.floorY + 0.44, z, { ry });
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    P.box(0.05, 0.44, 0.05, PAL.woodDark, x + (sx * 0.12) * Math.cos(ry) - sz * 0.06 * Math.sin(ry), ST.floorY + 0.22, z + (sz * 0.08) + sx * 0.1 * Math.sin(ry));
  }
}

function bench(x, z, len, ry = 0, baseY = ST.floorY) {
  P.box(len, 0.08, 0.34, PAL.wood, x, baseY + 0.42, z, { ry });
  for (const s of [-1, 1]) {
    P.box(0.08, 0.42, 0.3, PAL.woodDark, x + Math.cos(ry) * s * (len / 2 - 0.2), baseY + 0.21, z - Math.sin(ry) * s * (len / 2 - 0.2), { ry });
  }
}

function shelfUnit(cx, z, w, h, rows, colors) {
  const d = 0.4;
  P.box(w, h, 0.05, PAL.woodDark, cx, ST.floorY + h / 2, z - d / 2);
  for (let r = 0; r <= rows; r++) {
    P.box(w, 0.05, d, PAL.woodLight, cx, ST.floorY + (h * r) / rows, z);
  }
  P.box(0.06, h, d, PAL.woodDark, cx - w / 2, ST.floorY + h / 2, z);
  P.box(0.06, h, d, PAL.woodDark, cx + w / 2, ST.floorY + h / 2, z);
  for (let r = 0; r < rows; r++) {
    const y = ST.floorY + (h * r) / rows + 0.12;
    let x = cx - w / 2 + 0.14;
    while (x < cx + w / 2 - 0.12) {
      const t = rand();
      if (t < 0.4) {
        P.box(rnd(0.12, 0.2), rnd(0.16, 0.28), 0.2, pick(colors), x, y + 0.1, z + 0.02);
        x += 0.24;
      } else if (t < 0.7) {
        P.cyl(0.06, 0.06, rnd(0.2, 0.3), pick(colors), x, y + 0.12, z + 0.02, {}, 9);
        x += 0.18;
      } else {
        P.sph(0.08, pick(colors), x, y + 0.08, z + 0.04, {}, 9, 6);
        x += 0.2;
      }
    }
  }
}

/* 纸灯笼：白天也挂，纸面透光但不点灯 */
function paperLantern(x, y, z, r = 0.22, color = PAL.lantern) {
  P.sph(r, color, x, y, z, { sy: 1.16, jitter: false });
  P.cyl(r * 0.45, r * 0.45, 0.045, PAL.woodDark, x, y + r * 1.1, z, { jitter: false }, 8);
  P.cyl(r * 0.45, r * 0.45, 0.045, PAL.woodDark, x, y - r * 1.1, z, { jitter: false }, 8);
  P.box(0.02, 0.2, 0.02, PAL.gold || PAL.ochre, x, y - r * 1.35, z, { jitter: false });
  P.box(0.02, 0.24, 0.02, PAL.woodDark, x, y + r * 1.35, z, { jitter: false });
}

function tree(x, z, s = 1, seed = 0) {
  P.cyl0(0.22 * s, 0.34 * s, 0.34, PAL.curb, x, SITE.walkY, z, {}, 10);

  for (const [dx, dy, dz, rz] of [[-0.4, 1.3, 0.2, 0.7], [0.42, 1.2, -0.15, -0.62], [0.1, 1.5, 0.35, 0.3]]) {
    P.cyl(0.05 * s, 0.11 * s, 1.0 * s, PAL.trunk, x + dx * s, SITE.walkY + dy * s + 0.9, z + dz * s, { rz, rx: dz }, 7);
  }
  const canopy = [
    [0, 2.2, 0, 1.15],
    [-0.85, 2.0, 0.15, 0.8],
    [0.8, 2.1, -0.1, 0.85],
    [0.15, 2.65, 0.25, 0.8],
    [-0.35, 1.85, -0.7, 0.7],
    [0.45, 1.9, 0.65, 0.65],
  ];
  for (const [dx, dy, dz, r] of canopy) {
    P.sph(r * s, 0x4f7a45, x + dx * s, SITE.walkY + dy * s, z + dz * s, { sy: 0.78, jitter: true }, 9, 6);
    P.sph(r * 0.62 * s, 0x6f9d55, x + dx * s - 0.1, SITE.walkY + (dy + r * 0.45) * s, z + dz * s + 0.05, { sy: 0.5 }, 7, 5);
  }
  /* 红绸 */
  for (let i = 0; i < 10; i++) {
    const a = rnd(0, Math.PI * 2), rr = rnd(0.5, 1.1) * s;
    P.box(0.09 * s, rnd(0.3, 0.5) * s, 0.012, pick([0xc23a2c, 0xb8322a, 0xd0453a]), x + Math.cos(a) * rr, SITE.walkY + rnd(1.9, 2.5) * s, z + Math.sin(a) * rr, { ry: rnd(0, 3), rz: rnd(-0.3, 0.3) });
  }
  /* 树池 */
  P.box(1.2 * s, 0.08, 1.2 * s, PAL.curb, x, SITE.walkY + 0.04, z);
}

/* ---------- 赶集的人：低模、无脸，跟场景同一套描边 ---------- */
function person(x, z, o = {}) {
  const ry = o.ry || 0;
  let s = o.s || 1;
  const sit = !!o.sit;
  const baseY = o.baseY != null ? o.baseY : 0.03;
  const coat = o.coat || pick([0x3f5f80, 0x7a2a22, 0x4f6a4a, 0x8a6a3a, 0x5a4a6a, 0x2f3a44, 0x8a4a3a]);
  const pants = o.pants || pick([0x2a2a30, 0x3a3228, 0x4a4a52, 0x2f3a44]);
  const skin = pick([0xe8c9a8, 0xdcb894, 0xf0d6b8]);
  const hat = o.hat !== undefined ? o.hat : pick([null, null, null, 0xd9b46a, 0x3a3a3a]);
  const cos = Math.cos(ry), sin = Math.sin(ry);
  const at = (lx, lz) => [x + lx * cos - lz * sin, z + lx * sin + lz * cos];
  s = s * 1.09;
  const put = (w, h, d, c, lx, ly, lz, rz = 0) => {
    const [px, pz] = at(lx * s, lz * s);
    P.box(w * s, h * s, d * s, c, px, baseY + ly * s, pz, { ry, rz, jitter: false });
  };
  if (!sit) {
    put(0.13, 0.6, 0.16, pants, -0.1, 0.3, 0);
    put(0.13, 0.6, 0.16, pants, 0.1, 0.3, 0);
  } else {
    for (const side of [-1, 1]) {
      put(0.13, 0.14, 0.42, pants, side * 0.1, 0.44, 0.2);
      put(0.12, 0.44, 0.13, pants, side * 0.1, 0.22, 0.42);
    }
  }
  put(0.42, 0.6, 0.26, coat, 0, sit ? 0.78 : 0.92, 0);
  put(0.44, 0.08, 0.28, coat === 0x7a2a22 ? 0xb8322a : 0xd9b777, 0, sit ? 0.55 : 0.72, 0);
  for (const side of [-1, 1]) {
    put(0.11, 0.48, 0.13, coat, side * 0.26, sit ? 0.88 : 0.94, 0.02, side * 0.06);
    put(0.1, 0.12, 0.12, skin, side * 0.27, sit ? 0.62 : 0.68, 0.05);
  }
  const headY = sit ? 1.26 : 1.4;
  P.sph(0.15 * s, skin, x, baseY + headY * s, z, { jitter: false }, 9, 6);
  if (hat === null) {
    P.sph(0.155 * s, 0x2a2420, x, baseY + (headY + 0.05) * s, z, { sy: 0.6, jitter: false }, 8, 5);
  } else {
    P.cyl(0.04 * s, 0.3 * s, 0.09 * s, hat, x, baseY + (headY + 0.12) * s, z, { jitter: false }, 10);
  }
  if (o.basket) {
    const [bx, bz] = at(0.32 * s, 0.12 * s);
    P.cyl(0.12 * s, 0.1 * s, 0.16 * s, PAL.bamboo, bx, baseY + 0.62 * s, bz, { jitter: false }, 8);
    P.cyl(0.11 * s, 0.11 * s, 0.02 * s, PAL.bambooDark, bx, baseY + 0.71 * s, bz, { jitter: false }, 8);
  }
  if (o.pole) {
    put(0.04, 1.7, 0.04, PAL.bamboo, 0.3, 0.9, 0.2, 0.12);
  }
}

function radialTexture(size = 128) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.4, 'rgba(255,255,255,0.5)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const glowTexture = radialTexture();

const glowSprites = [];
function addGlowSprite(x, y, z, size, color, opacity) {
  const mat = new THREE.SpriteMaterial({
    map: glowTexture, color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: true,
  });

  s.userData.phase = rnd(0, 6.28);

  scene.add(s);

}

/* ---------- 风车：单独网格，能自己转 ---------- */
function makeSeparate(name, outline = false) {
  const b = BUCKETS.get(name);
  if (!b || !b.pos.length) return null;
  const geo = toGeometry(b);
  BUCKETS.delete(name);
  const g = new THREE.Group();
  const mesh = new THREE.Mesh(geo, toonMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.customDepthMaterial = depthMat;
  g.add(mesh);
  if (outline) g.add(new THREE.Mesh(geo, outlineMat));
  scene.add(g);
  return g;
}

layer(0.3);
{

/* 天上的三只风筝：会上下飘 */

/* ---------- 相机：拖拽旋转 / 滚轮缩放 / 双指捏合 ---------- */
const cam = {
  az: -0.42, pol: 0.86, dist: 120,
  goalAz: -0.9, goalPol: 1.18, goalDist: 74,
  target: new THREE.Vector3(0, 2.2, 0),
};
/* 竖屏：顺着街看，长街才装得下 */
if (window.innerWidth < window.innerHeight) {
  cam.goalAz = -1.2;
  cam.goalDist = 54;
}
const intro = { t: 0, dur: 4.4, done: SKIP_INTRO };
for (const [key, field] of [['az', 'goalAz'], ['pol', 'goalPol'], ['dist', 'goalDist']]) {
  const v = parseFloat(QS.get(key));
  if (Number.isFinite(v)) cam[field] = v;
}
for (const [key, field] of [['tx', 'x'], ['ty', 'y'], ['tz', 'z']]) {
  const v = parseFloat(QS.get(key));
  if (Number.isFinite(v)) cam.target[field] = v;
}
if (SKIP_INTRO) {
  cam.az = cam.goalAz; cam.pol = cam.goalPol; cam.dist = cam.goalDist;
}

let dragging = false;
let panning = false;
let lastX = 0, lastY = 0;
let lastMid = null;
let lastInput = -999;
let NOW = 0;
const pointers = new Map();
let pinchDist = 0;

/* 把看点限制在底座范围内，别一拖就拖到天边 */
function clampTarget() {
  cam.target.x = THREE.MathUtils.clamp(cam.target.x, -32, 32);
  cam.target.z = THREE.MathUtils.clamp(cam.target.z, -5.6, 5.6);
}

/* 平移：按屏幕像素换算成地面上的位移 */
function panBy(dx, dy) {
  const k = (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * cam.dist * fitK) / Math.max(window.innerHeight, 1);
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az);
  const fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  cam.target.x += -rx * dx * k + fx * dy * k;
  cam.target.z += -rz * dx * k + fz * dy * k;
  clampTarget();
  lastInput = NOW;
}

/* 键盘：WASD / 方向键在街上走 */
const held = new Set();
const MOVE_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
window.addEventListener('keydown', (e) => {
  const k = (e.key || '').toLowerCase();
  if (MOVE_KEYS.includes(k)) {
    held.add(k);
    lastInput = NOW;
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e) => {
  const k = (e.key || '').toLowerCase();
  held.delete(k);
});
window.addEventListener('blur', () => held.clear());

function moveByKeys(dt) {
  if (!held.size) return;
  const sp = Math.sin(cam.az), cs = Math.cos(cam.az);
  const fx = -sp, fz = -cs;
  const rx = cs, rz = -sp;
  let mx = 0, mz = 0;
  const speed = 13 * (cam.dist / 60);
  if (held.has('w') || held.has('arrowup')) { mx += fx; mz += fz; }
  if (held.has('s') || held.has('arrowdown')) { mx -= fx; mz -= fz; }
  if (held.has('d') || held.has('arrowright')) { mx += rx; mz += rz; }
  if (held.has('a') || held.has('arrowleft')) { mx -= rx; mz -= rz; }
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    cam.target.x += (mx / len) * speed * dt;
    cam.target.z += (mz / len) * speed * dt;
    clampTarget();
    lastInput = NOW;
  }
}

function onPointerDown(e) {
  /* 入场没放完也能直接操作：第一下按下去就结束入场，而不是把这次点击吞掉 */
  if (!intro.done) { intro.done = true; intro.t = 1; }
  try { canvas.setPointerCapture?.(e.pointerId); } catch (err) { /* 拿不到捕获也能拖动 */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true;
  panning = e.button === 2 || e.button === 1 || e.shiftKey;
  lastX = e.clientX;
  lastY = e.clientY;
  lastInput = NOW;
  canvas.classList.add('grabbing');
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
}
function onPointerMove(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInput = NOW;
  if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) {
      cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * (pinchDist / Math.max(d, 1)), 16, 120);
    }
    pinchDist = d;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastMid) panBy(mid.x - lastMid.x, mid.y - lastMid.y);
    lastMid = mid;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX;
  lastY = e.clientY;
  if (panning) {
    panBy(dx, dy);
    return;
  }
  cam.goalAz -= dx * 0.0055;
  cam.goalPol = THREE.MathUtils.clamp(cam.goalPol - dy * 0.0042, 0.42, 1.42);
}
function onPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    dragging = false;
    panning = false;
    canvas.classList.remove('grabbing');
  }
  pinchDist = 0;
  lastMid = null;
}
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  lastInput = NOW;
  cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * Math.exp(e.deltaY * 0.0011), 16, 120);
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function updateCamera(dt, now) {
  if (!intro.done) {
    intro.t = Math.min(1, intro.t + dt / intro.dur);
    const k = 1 - Math.pow(1 - intro.t, 3);
    cam.az = THREE.MathUtils.lerp(-0.42, cam.goalAz, k);
    cam.pol = THREE.MathUtils.lerp(0.86, cam.goalPol, k);
    cam.dist = THREE.MathUtils.lerp(120, cam.goalDist, k);
    if (intro.t >= 1) intro.done = true;
  } else {
    const idle = now - lastInput > 7 && !dragging;
    if (idle) cam.goalAz += dt * 0.024;
    const k = 1 - Math.exp(-dt * 7.5);
    cam.az += (cam.goalAz - cam.az) * k;
    cam.pol += (cam.goalPol - cam.pol) * k;
    cam.dist += (cam.goalDist - cam.dist) * k;
  }
  const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
  const d = cam.dist * fitK;
  camera.position.set(
    cam.target.x + Math.sin(cam.az) * sp * d,
    cam.target.y + cp * d,
    cam.target.z + Math.cos(cam.az) * sp * d
  );
  camera.lookAt(cam.target);
}

/* ---------- 主循环 ---------- */
let assembleStart = null;
let firstFrame = true;
const HOLD = parseFloat(QS.get('hold'));

function animate() {
  requestAnimationFrame(animate);
  tickTime();
  const dt = timeState.delta;
  const now = timeState.elapsed;
  NOW = now;
  U.time.value = now;

  /* 入场：从地面一件件长出来 */
  if (assembleStart == null) assembleStart = now;
  const raw = Number.isFinite(HOLD) ? HOLD : (SKIP_INTRO ? 1 : THREE.MathUtils.clamp((now - assembleStart - 0.6) / 6.2, 0, 1));
  U.assemble.value = raw;

  /* 尘埃 */
  for (let i = 0; i < DUST_N; i++) {
    dustPos[i * 3] += Math.sin(now * 0.3 + dustSeed[i] * 9) * dt * 0.12;
    dustPos[i * 3 + 1] += dt * (0.05 + dustSeed[i] * 0.06);
    dustPos[i * 3 + 2] += Math.cos(now * 0.24 + dustSeed[i] * 7) * dt * 0.1;
    if (dustPos[i * 3 + 1] > 7.2) dustPos[i * 3 + 1] = 0.4;
  }
  dustGeo.attributes.position.needsUpdate = true;

  /* 炊烟 */
  for (let i = 0; i < SMOKE_N; i++) {
    smokePos[i * 3 + 1] += dt * (0.24 + smokeSeed[i] * 0.2);
    smokePos[i * 3] += Math.sin(now * 0.5 + i) * dt * 0.1;
    if (smokePos[i * 3 + 1] > 6.4) {
      smokePos[i * 3] = -10.9 + rnd(-0.15, 0.15);
      smokePos[i * 3 + 1] = 1.5;
      smokePos[i * 3 + 2] = -5.9 + rnd(-0.15, 0.15);
    }
  }
  smokeGeo.attributes.position.needsUpdate = true;

  /* 栗子锅热气 */
  for (let i = 0; i < STEAM_N; i++) {
    steamPos[i * 3 + 1] += dt * (0.34 + steamSeed[i] * 0.26);
    steamPos[i * 3] += Math.sin(now * 0.8 + i) * dt * 0.12;
    if (steamPos[i * 3 + 1] > 2.6) {
      steamPos[i * 3] = -20.7 + rnd(-0.22, 0.22);
      steamPos[i * 3 + 1] = 0.85;
      steamPos[i * 3 + 2] = -6.2 + rnd(-0.22, 0.22);
    }
  }
  steamGeo.attributes.position.needsUpdate = true;

  /* 风车、走马灯、幡布 */
  for (const m of mills) {
    if (m) m.rotation.z = now * m.userData.spin;
  }
  if (zouma) zouma.rotation.y = now * 0.8;
  for (const f of fans) {
    if (f) f.rotation.z = Math.sin(now * 0.9 + f.userData.phase) * 0.05;
  }
  kites.forEach((k, i) => {
    if (k) {
      k.position.y = kitePos[i][1] + Math.sin(now * 0.7 + k.userData.phase) * 0.28;
      k.rotation.z = Math.sin(now * 0.55 + k.userData.phase) * 0.1;
      k.rotation.y = Math.sin(now * 0.35 + k.userData.phase) * 0.25;
    }
  });
  if (lion) {
    lion.rotation.z = Math.sin(now * 2.2) * 0.05;
    lion.position.y = SITE.roadY + Math.abs(Math.sin(now * 2.2)) * 0.04;
  }

  /* 光晕轻轻呼吸 */
  for (const s of glowSprites) {
    s.material.opacity = s.userData.base * (0.9 + 0.1 * Math.sin(now * s.userData.speed + s.userData.phase));
  }

  stageLight.intensity = 3.2 + Math.sin(now * 1.3) * 0.25;

  moveByKeys(dt);
  updateCamera(dt, now);

  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const boot = document.getElementById('boot');
    if (boot) {
      if (SHOT) boot.style.display = 'none';
      else boot.classList.add('gone');
    }
    window.__MINS_READY = true;
  }
}

window.__MINS_DIAG = () => ({
  assemble: +U.assemble.value.toFixed(3),
  drawCalls: renderer.info.render.calls,
  triangles: renderer.info.render.triangles,
  camera: [cam.az, cam.pol, cam.dist].map((v) => +v.toFixed(2)),
});
window.__MINS = {
  scene, camera, renderer, cam,
  setView(az, pol, dist) {
    intro.done = true;
    cam.goalAz = cam.az = az;
    cam.goalPol = cam.pol = pol;
    cam.goalDist = cam.dist = dist;
    updateCamera(0, timeState.elapsed);
  },
  finish() { U.assemble.value = 1; },
};

animate();
</script>
