.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}

.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}

L531 361.9ZM530.4 370.9L421.9 421.6L421.9 412.9L530.4 362.3Z"/><path class="iso-shade" data-shade="1" d="M421.9 421.6L421 421.8L421 413.1L421.9 412.9Z"/><path class="iso-shade" data-shade="2" d="M421 421.8L420 421.8L420 413.1L421 413.1Z"/><path class="iso-shade" data-shade="3" d="M420 421.8L419.2 421.5L419.2 412.9L420 413.1ZM419.2 421.5L413.3 418.3L413.3 409.7L419.2 412.9ZM413.3 418.3L412.8 417.9L412.8 409.3L413.3 409.7Z"/><path class="iso-top" d="M530.5 361L531 361.4L531 361.9L530.4 362.3L421.9 412.9L421 413.1L420 413.1L419.2 412.9L413.3 409.7L412.8 409.3L412.8 408.8L413.3 408.4L521.9 357.7L522.8 357.5L523.8 357.5L524.6 357.8Z"/><path class="iso-line iso-crease" data-tone="faint" d="M531 361.4L531 361.9L530.4 362.3L421.9 412.9L421 413.1L420 413.1L419.2 412.9L413.3 409.7L412.8 409.3"/><path class="iso-line iso-bevel" data-tone="faint" d="M531 361.4L530.2 361.8L529.9 362.1L421.4 412.6L420.8 412.8L420.3 412.8L419.7 412.6L413.9 409.5L412.8 409.3"/><path class="iso-line iso-edge" data-tone="mid" d="M412.8 409.3L412.8 408.8L413.3 408.4L521.9 357.7L522.8 357.5L523.8 357.5L524.6 357.8L530.5 361L531 361.4M531 370L531 370.5L530.4 370.9L421.9 421.6L421 421.8L420 421.8L419.2 421.5L413.3 418.3L412.8 417.9M531 361.4L531 370M412.8 409.3L412.8 417.9"/></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>机楼与织机木架</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>当前动作部件</span></span><span class="iso-caption">教学示意：突出上下两名工匠配合的织造动作；结构与比例未经实物测绘。</span></figcaption></figure><section class="loom-controls" aria-label="织造动作"><div class="loom-kicker">上下协作 · 一次引纬循环</div><div class="loom-step-buttons"><button type="button" data-step="0" aria-pressed="true"><span>01</span>拽花提线</button><button type="button" data-step="1" aria-pressed="false"><span>02</span>形成梭口</button><button type="button" data-step="2" aria-pressed="false"><span>03</span>引入纬丝</button><button type="button" data-step="3" aria-pressed="false"><span>04</span>打纬成织</button></div><div class="loom-explain" aria-live="polite"><strong data-step-title>拽花提线</strong><p data-step-text>上层拽花工按花本顺序提起相应的线，使纹部经丝抬起。</p></div><p class="loom-note">动作与工序取自公开资料；未使用原站图片或录像。所示丝线数量和机构比例已简化。</p></section><aside class="loom-sources"><h2>资料依据</h2><a href="https://www.ihchina.cn/art/detail/id/14276.html" target="_blank" rel="noopener noreferrer">中国非物质文化遗产网 · 项目介绍 ↗</a><a href="https://artlab.nju.edu.cn/heritage/jp/brocade/weaving/" target="_blank" rel="noopener noreferrer">南京大学 · 云锦织造动作说明 ↗</a></aside></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
    });
    const facing = normals.map(([nx, ny]) => nx * vx + ny * vy > 1e-9);
    const top = ring.map(([x, y]) => iso([x, y, z + height], projection));
    const bottom = ring.map(([x, y]) => iso([x, y, z], projection));
    const outline = [];
    const crease = [];
    for (const run of runsOf(facing, false))
        outline.push(pathOf(run.map((index) => top[index])));
    for (const run of runsOf(facing, true)) {
        crease.push(pathOf(run.map((index) => top[index])));
        if (height > 0)
            outline.push(pathOf(run.map((index) => bottom[index])));
    }
    if (height > 0) {
        for (let index = 0; index < count; index++) {
            if (facing[(index + count - 1) % count] !== facing[index])
                outline.push(pathOf([top[index], bottom[index]]));
        }
    }
    let fill;
    if (convex) {
        fill = pathOf(convexHull([...top, ...bottom]), true);
    }
    else {
        const parts = [pathOf(oriented(top), true), pathOf(oriented(bottom), true)];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const next = (index + 1) % count;
            parts.push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
        fill = parts.join("");
    }
    const buckets = Array.from({ length: SHADES }, () => []);
    if (height > 0) {
        const [lx, ly] = [-sinA, cosA];
        for (let index = 0; index < count; index++) {
            if (!facing[index])
                continue;
            const [nx, ny] = normals[index];
            const lit = (nx * lx + ny * ly + 1) / 2;
            const shade = Math.min(SHADES - 1, Math.max(0, Math.floor(lit * SHADES)));
            const next = (index + 1) % count;
            buckets[shade].push(pathOf(oriented([top[index], top[next], bottom[next], bottom[index]]), true));
        }
    }
    let bevel;
    if (options.bevel && options.bevel > 0) {
        const by = options.bevel;
        const inset = ring.map(([x, y], index) => {
            const [ax, ay] = normals[(index + count - 1) % count];
            const [bx, by2] = normals[index];
            const mx = ax + bx;
            const my = ay + by2;
            const length = Math.hypot(mx, my) || 1;
            return [x - (mx / length) * by, y - (my / length) * by];
        });

`;

const steps=[{"title":"拽花提线","text":"上层拽花工按花本顺序提起相应的线，使纹部经丝抬起。","active":"harness"},{"title":"形成梭口","text":"下层织手踩踏脚杆，与拽花工配合，让经丝上下分开。","active":"warp"},{"title":"引入纬丝","text":"织手在打开的经丝之间送入纬丝；妆花的局部彩纬另需过管挖花。","active":"shuttle"},{"title":"打纬成织","text":"织手将筘框拉向织口，把新引入的纬丝推紧。随后继续下一次配合。","active":"reed"}];
const P={"origin":[380,370.6263354824854],"scale":0.9863365331225699,"azimuth":43,"elevation":30};

const buttons=[...document.querySelectorAll('[data-step]')];
const reed=document.querySelector('[data-part="reed"]');
const shuttle=document.querySelector('[data-part="shuttle"]');
const warps=[...document.querySelectorAll('[data-warp="1"]')];
const harness=[...document.querySelectorAll('[data-harness="lift"]')];
const readout=document.querySelector('[data-readout]');
const transport=document.createElement('div');

transport.innerHTML='<button type="button" data-play>暂停演示</button><button type="button" data-replay>从头重播</button><label>演示进度 <input type="range" min="0" max="12" step="0.01" value="0" aria-label="织造演示进度"></label><span data-time>0.0 / 12 秒</span>';

const smooth=(a,b,t)=>{const v=Math.max(0,Math.min(1,(t-a)/(b-a)));return v*v*(3-2*v);};

 stage.setAttribute('aria-label','云锦木机交互图解，第'+(current+1)+'步：'+step.title+'。'+step.text);

function model(t){
 const release=1-smooth(9.2,10.2,t);

 return {lift:7*smooth(.2,2.6,t)*release,open:12*smooth(3,5.4,t)*release,shuttle:direction*(-55+110*smooth(6,8.8,t)),reed:-18*smooth(9.4,10.6,t)*(1-smooth(10.7,12,t))};

 for(const key of Object.keys(pose))pose[key]+=(target[key]-pose[key])*ease;
 harness.forEach((el,i)=>{
   const x=-70+i*30, a=iso([x,28,174],P), b=iso([x,17,99+pose.lift],P);
   el.querySelector('path').setAttribute('d','M'+a.join(' ')+'L'+b.join(' '));
   const end=el.querySelectorAll('circle')[1];end.setAttribute('cx',b[0]);end.setAttribute('cy',b[1]);
 });
 warps.forEach((el,i)=>{
   const x=-79+(i*2+1)*5.65;
   const a=iso([x,63,87],P), b=iso([x,10,71.312+pose.open],P), c=iso([x,-62,50],P);
   el.querySelector('path').setAttribute('d','M'+a.join(' ')+'L'+b.join(' ')+'L'+c.join(' '));
 });

 reed.setAttribute('transform',translateAlong(P,[0,pose.reed,0]));
 announce(Math.min(3,Math.floor(time/3)));
 progress.value=String(time);timeLabel.textContent=time.toFixed(1)+' / 12 秒';
 return Object.keys(pose).some(key=>Math.abs(pose[key]-target[key])>.01);
