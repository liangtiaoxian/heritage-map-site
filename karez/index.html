<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2a211a" />
<title>坎儿井 · 剖面沙盘</title>
<style>html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #e7dfca;
}

body {
  /* 无 UI：整屏只有 canvas，背景只做一层戈壁天光渐变 */
  background:
    radial-gradient(125% 95% at 50% 4%, #f7f0dd 0%, #eadfc6 46%, #cfbfa0 100%);
  cursor: grab;
}

canvas#scene {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}

canvas.grabbing { cursor: grabbing; }

body::after {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(74% 64% at 50% 46%, rgba(0, 0, 0, 0) 56%, rgba(110, 88, 54, 0.18) 100%);
}

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  color: #6a5636;
  font: 500 15px/1.7 "Songti SC", "SimSun", "Microsoft YaHei", serif;
  letter-spacing: 0.22em;
  background: #f3ecd8;
  transition: opacity 0.9s ease, visibility 0.9s;
  z-index: 10;
}

#boot span { font-size: 20px; letter-spacing: 0.34em; color: #4a3a22; }
#boot i { font-style: normal; font-size: 12px; color: #9c8763; letter-spacing: 0.3em; }
#boot.gone { opacity: 0; visibility: hidden; }

#boot.error {
  align-items: flex-start;
  padding: 8vh 9vw;
  letter-spacing: normal;
  font-family: "Microsoft YaHei", sans-serif;
  background: #2b3238;
  color: #dfe7ea;
}
#boot.error h1 { font-size: 18px; color: #ffb4a0; margin: 0 0 12px; }
#boot.error pre { white-space: pre-wrap; font-size: 13px; color: #c9d2d6; max-width: 760px; }

/* ---------- UI：总介绍 / 热点卡片放右下角，按键条放左下角 ---------- */
#hud {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;            /* 整层不吃鼠标，拖动照常传到 canvas */
  font: 400 13px/1.62 "Songti SC", "SimSun", "Microsoft YaHei", serif;
  color: #3d3222;
}

.hud-side {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 330px;
  max-height: calc(100% - 90px);
  overflow: auto;
  pointer-events: none;            /* 只有卡片本身可点，空的时候不挡拖动 */
}

.hud-body,
.hud-card {
  padding: 15px 17px;
  background: rgba(250, 245, 232, 0.9);
  border: 1px solid rgba(120, 96, 60, 0.32);
  border-radius: 12px;
  backdrop-filter: blur(5px);
  box-shadow: 0 8px 26px rgba(80, 60, 30, 0.15);
  /* 中文长句必须能断行，任何宽度下都不许横向溢出 */
  box-sizing: border-box;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.hud-body p,
.hud-card p,
.hud-card h2,
.hud-legend li {
  overflow-wrap: anywhere;
  word-break: break-word;
  max-width: 100%;
}

.hud-body { pointer-events: auto; }

.hud-kicker {
  display: block;
  font-size: 11px;
  letter-spacing: 0.26em;
  color: #8a7250;
  margin-bottom: 5px;
}

.hud-body h1 {
  margin: 0 0 9px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: #2f2a22;
}

.hud-lead { margin: 0 0 11px; }
.hud-lead b { color: #8a4a22; }

.hud-legend {
  margin: 0 0 11px;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 5px;
}
.hud-legend li { display: flex; align-items: baseline; gap: 7px; }
.hud-legend i {
  flex: none;
  width: 11px;
  height: 11px;
  border-radius: 2px;
  border: 1px solid rgba(60, 45, 25, 0.45);
  transform: translateY(1px);
}
.hud-legend b { flex: none; color: #2f2a22; }
.hud-legend span { color: #6a5a40; font-size: 12px; }

.hud-tip {
  margin: 0;
  font-size: 12px;
  color: #6a5a40;
  border-top: 1px dashed rgba(120, 96, 60, 0.35);
  padding-top: 9px;
}
.hud-tip b { color: #a06a1e; }

/* 热点卡片：跟着光点跑，位置每帧由 JS 按屏幕投影算 */
.hud-card {
  position: fixed;
  left: 0;
  top: 0;
  width: 296px;
  max-width: calc(100vw - 28px);
  margin: 0;
  pointer-events: auto;
  will-change: transform;
}
.hud-card[hidden] { display: none; }

/* 指向光点的小箭头：卡片在光点右侧就朝左，反之朝右 */
.hud-card::after {
  content: '';
  position: absolute;
  top: 26px;
  width: 13px;
  height: 13px;
  background: rgba(252, 248, 238, 0.97);
  border: 1px solid rgba(120, 96, 60, 0.34);
  transform: rotate(45deg);
}
.hud-card.right-of-dot::after { left: -7px; border-right: 0; border-top: 0; }
.hud-card.left-of-dot::after { right: -7px; border-left: 0; border-bottom: 0; }

.card-close {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 26px;
  height: 26px;
  padding: 0;
  font: inherit;
  font-size: 17px;
  line-height: 1;
  color: #6a5a40;
  background: rgba(255, 252, 244, 0.9);
  border: 1px solid rgba(120, 96, 60, 0.35);
  border-radius: 50%;
  cursor: pointer;
}
.card-close:hover { background: #fff; color: #2f2a22; }

.card-kicker {
  display: block;
  font-size: 10px;
  letter-spacing: 0.24em;
  color: #a08a5e;
  margin-bottom: 4px;
}

.hud-card h2 {
  margin: 0 0 8px;
  font-size: 19px;
  font-weight: 600;
  color: #2f2a22;
  letter-spacing: 0.06em;
}

.hud-card p { margin: 0 0 10px; }

.card-back {
  display: block;
  font-size: 11px;
  color: #9a8763;
  border-top: 1px dashed rgba(120, 96, 60, 0.32);
  padding-top: 8px;
}

/* 按键条：左下角 */
.hud-keys {
  position: absolute;
  left: 18px;
  bottom: 16px;
  pointer-events: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 12px;
  max-width: min(56vw, 620px);
  font-size: 12px;
  color: #5a4a33;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}

.hud-keys kbd {
  display: inline-block;
  padding: 1px 5px;
  font: inherit;
  font-size: 11px;
  background: rgba(250, 245, 232, 0.9);
  border: 1px solid rgba(120, 96, 60, 0.4);
  border-radius: 4px;
}

/* 鼠标悬停到热点上时变成手型 */
canvas.hovering { cursor: pointer; }
canvas.hovering.grabbing { cursor: grabbing; }

/* 竖屏 / 窄屏：面板靠下收窄；卡片放不下「旁边」，退回底部整条 */
@media (max-width: 780px) {
  .hud-side { width: auto; left: 12px; right: 12px; bottom: 52px; }
  .hud-body, .hud-card { padding: 13px 14px; }
  .hud-body h1 { font-size: 16px; }
  .hud-legend span { display: none; }
  .hud-keys { left: 12px; right: 12px; bottom: 10px; font-size: 11px; gap: 4px 9px; max-width: none; }
  .hud-card {
    left: 12px;
    right: 12px;
    top: auto;
    bottom: 52px;
    width: auto;
  }
  .hud-card::after { display: none; }
}
/* ============================================================================
 * 场景导览 UI 样式（可复用）
 * 由 tour.js 自动注入的 DOM 使用；宿主只需把这份 CSS 打进页面即可。
 * 想改配色，覆盖这几个变量就行：--tour-bg / --tour-ink / --tour-line / --tour-accent
 * ==========================================================================*/

#tour {
  --tour-bg: rgba(250, 245, 232, 0.92);
  --tour-bg-solid: rgba(252, 248, 238, 0.97);
  --tour-ink: #3d3222;
  --tour-ink-strong: #2f2a22;
  --tour-ink-soft: #6a5a40;
  --tour-line: rgba(120, 96, 60, 0.32);
  --tour-accent: #a06a1e;

  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;            /* 整层不吃鼠标，拖动照常传到 canvas */
  font: 400 13px/1.62 "Songti SC", "SimSun", "Microsoft YaHei", serif;
  color: var(--tour-ink);
}

.tour-side {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 330px;
  max-height: calc(100% - 90px);
  overflow: auto;
  pointer-events: none;            /* 只有卡片本身可点 */
}

/* ---------- 左上角标题：墨色斜切底 + 楷体米白大字 ---------- */
.tour-masthead {
  position: absolute;
  top: 0;
  left: 0;
  padding: 17px 64px 16px 24px;
  /* 右缘斜切：上宽下窄，像一道墨迹扫过去 */
  clip-path: polygon(0 0, 100% 0, calc(100% - 36px) 100%, 0 100%);
  background: linear-gradient(100deg, rgba(12, 14, 18, 0.95) 0%, rgba(18, 22, 28, 0.92) 62%, rgba(20, 25, 32, 0.8) 100%);
  color: #f4ecda;
  pointer-events: none;
}

.tour-masthead-index {
  display: block;
  margin-bottom: 7px;
  color: #d9b071;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.36em;
}

.tour-masthead h1 {
  margin: 0;
  font-family: "KaiTi", "STKaiti", "Kaiti SC", "楷体", "Noto Serif SC", "Songti SC", "STSong", serif;
  font-size: clamp(30px, 3.4vw, 44px);
  font-weight: 400;
  line-height: 1;
  letter-spacing: 0.17em;
  text-indent: 0.06em;
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 2px rgba(255, 245, 226, 0.18);
}

.tour-intro,
.tour-card {
  padding: 15px 17px;
  background: var(--tour-bg);
  border: 1px solid var(--tour-line);
  border-radius: 12px;
  backdrop-filter: blur(5px);
  box-shadow: 0 8px 26px rgba(80, 60, 30, 0.15);
  box-sizing: border-box;
  max-width: 100%;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.tour-intro { pointer-events: auto; }
.tour-intro[hidden] { display: none; }

.tour-kicker {
  display: block;
  font-size: 11px;
  letter-spacing: 0.26em;
  color: #8a7250;
  margin-bottom: 5px;
}

.tour-intro h1 {
  margin: 0 0 9px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--tour-ink-strong);
}

.tour-lead { margin: 0 0 11px; }

.tour-legend {
  margin: 0 0 11px;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 5px;
}
.tour-legend li { display: flex; align-items: baseline; gap: 7px; }
.tour-legend i {
  flex: none;
  width: 11px;
  height: 11px;
  border-radius: 2px;
  border: 1px solid rgba(60, 45, 25, 0.45);
  transform: translateY(1px);
}
.tour-legend b { flex: none; color: var(--tour-ink-strong); }
.tour-legend span { color: var(--tour-ink-soft); font-size: 12px; }

.tour-tip {
  margin: 0;
  font-size: 12px;
  color: var(--tour-ink-soft);
  border-top: 1px dashed var(--tour-line);
  padding-top: 9px;
}

/* 热点卡片：跟着光点跑，位置由 tour.js 每帧按屏幕投影算 */
.tour-card {
  position: fixed;
  left: 0;
  top: 0;
  width: 296px;
  max-width: calc(100vw - 28px);
  margin: 0;
  pointer-events: auto;
  will-change: transform;
}
.tour-card[hidden] { display: none; }

/* 指向光点的小箭头：卡片在光点右侧就朝左，反之朝右 */
.tour-card::after {
  content: '';
  position: absolute;
  top: 26px;

}

}

  margin: 0 0 8px;

  font-weight: 600;

  letter-spacing: 0.06em;
}

.tour-back {
  display: block;
  font-size: 11px;
  color: #9a8763;
  border-top: 1px dashed var(--tour-line);
  padding-top: 8px;
}

/* 操作提示条：左下角 */
.tour-keys {
  position: absolute;
  left: 18px;
  bottom: 16px;
  pointer-events: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 12px;
  max-width: min(56vw, 620px);
  font-size: 12px;
  color: #5a4a33;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
}

  font: inherit;
  font-size: 11px;
  background: var(--tour-bg);

}

/* 鼠标悬停到热点上时变成手型 */
canvas.tour-hover { cursor: pointer; }
canvas.tour-hover.grabbing { cursor: grabbing; }

/* 竖屏 / 窄屏：面板靠下；卡片放不下「旁边」，退回底部整条 */
@media (max-width: 780px) {

    padding: 11px 42px 10px 15px;

  .tour-masthead-index { margin-bottom: 4px; font-size: 8px; letter-spacing: 0.28em; }

<canvas id="scene"></canvas>
<!-- 介绍面板 / 热点卡片由 tools/shared/tour.js 自动注入 -->
<div id="boot"><span>坎 儿 井</span><i>正在挖开地层</i></div>
<script>(function () {
  var panel = document.getElementById('boot');
  var booted = false;
  function show(title, detail) {
    if (booted) return;
    booted = true;
    panel.className = 'error';
    panel.innerHTML = '<h1></h1><pre></pre>';
    panel.querySelector('h1').textContent = title;
    panel.querySelector('pre').textContent = detail || '';
  }
  window.__MINS_FAIL = show;
  /* 无 UI 模式（截图用） */
  if (location.search.indexOf('nohud') >= 0) {
    var t = document.getElementById('tour');
    if (t) t.style.display = 'none';
  }
  if (location.protocol === 'file:') {
    show('请通过本地服务器打开', '浏览器会拦截 file:// 下的 ES 模块。\n运行 npm run dev 后访问 http://127.0.0.1:5173/karez/index.html');
    return;
  }
  if (!(window.WebGLRenderingContext || window.WebGL2RenderingContext)) {
    show('浏览器没有启用 WebGL', '请打开硬件加速，或换用 Chrome / Edge 最新版。');
    return;
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      show('资源加载失败', (t.src || t.href || '') + '\n检查 public/karez/vendor/three 是否已生成：npm run build:karez');
      return;
    }
    show('脚本出错', (e.message || '未知错误') + '\n' + String(e.filename || '').split('/').slice(-1)[0] + ':' + (e.lineno || '?'));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('脚本出错', String((e.reason && e.reason.message) || e.reason));
  });
  setTimeout(function () {
    if (window.__MINS_READY) return;
    var diag = '';
    try { if (window.__MINS_DIAG) diag = '\n' + JSON.stringify(window.__MINS_DIAG()); } catch (err) {}
    show('画面没有出现（9 秒超时）', '打开控制台看第一条红色报错。' + diag);
  }, 9000);
})();</script>
<script type="module">/* ============================================================================
 * 场景导览（可复用）—— 热点 + 跟随卡片 + 介绍面板
 * ----------------------------------------------------------------------------
 * 与具体场景无关：任何 three.js 场景传进 canvas / camera / 热点表就能用。
 * 自带 DOM 与样式（样式在 tour.css），不需要宿主写任何标签。
 *
 *   const tour = createSceneTour(THREE, {
 *     canvas, camera,
 *     ui:   { kicker, title, lead, legend:[{color,label,note}], tip, keys:[...] },
 *     spots:[{ id, name, en, marker:[x,y,z], view:{az,pol,dist,tx,ty,tz}, text }],
 *     onFlyTo(view) { ... },     // 宿主把镜头目标设过去（做插值）
 *     onReset()     { ... },     // 宿主把镜头复位
 *   });
 *   tour.open('id') / tour.close() / tour.update() 由内部 rAF 自己驱动，无需宿主调用
 * ==========================================================================*/

function createSceneTour(THREE, opts) {
  const {
    canvas, camera,
    ui = {},
    spots = [],
    onFlyTo = () => {},
    onReset = () => {},
    ringScale = 1.15,
    gap = 30,
    narrowWidth = 780,
    hover = true,
    tapSlop = 6,
    /* 可选：返回 false 时热点先不显示。
       微缩场景的零件是入场时在顶点着色器里「长」出来的，热点是直接 add 上去的、
       不受那套变形影响，所以模型还没成形时金环会浮在半空——用它挡一下。 */
    ready = null,
  } = opts;
  if (!canvas || !camera || !spots.length) {
    return { open() {}, close() {}, spots: () => [], screenOf: () => null };
  }

  const QS = new URLSearchParams(location.search);

  /* ---------- 1. 页面结构（自动注入） ---------- */
  const root = document.createElement('div');
  root.id = 'tour';
  root.innerHTML = `
    <div class="tour-masthead">
      <b class="tour-masthead-index"></b>
      <h1></h1>
    </div>
    <section class="tour-side">
      <div class="tour-intro" id="tour-intro">
        <span class="tour-kicker"></span>
        <h1></h1>
        <p class="tour-lead"></p>
        <ul class="tour-legend"></ul>
        <p class="tour-tip"></p>
      </div>
      <article class="tour-card" id="tour-card" hidden>
        <button class="tour-close" type="button" aria-label="关闭">×</button>
        <span class="tour-card-kicker"></span>
        <h2></h2>
        <p></p>
        <span class="tour-back">点空白处或 × 返回总览</span>
      </article>
    </section>
    <footer class="tour-keys"></footer>`;
  document.body.appendChild(root);

  const introEl = root.querySelector('#tour-intro');
  const cardEl = root.querySelector('#tour-card');

  /* 左上角标题：墨色斜切底 + 楷体大字（不传 ui.masthead 就不出现） */
  const mastheadEl = root.querySelector('.tour-masthead');
  if (ui.masthead) {
    root.querySelector('.tour-masthead-index').textContent = ui.mastheadIndex || '';
    root.querySelector('.tour-masthead h1').textContent = ui.masthead;
    if (!ui.mastheadIndex) root.querySelector('.tour-masthead-index').remove();
  } else {
    mastheadEl.remove();
  }

  root.querySelector('.tour-kicker').textContent = ui.kicker || '';
  root.querySelector('.tour-intro h1').textContent = ui.title || '';
  root.querySelector('.tour-lead').textContent = ui.lead || '';
  const tipEl = root.querySelector('.tour-tip');
  if (ui.tip) tipEl.textContent = ui.tip; else tipEl.remove();
  const legendEl = root.querySelector('.tour-legend');
  for (const item of (ui.legend || [])) {
    const li = document.createElement('li');
    li.innerHTML = `<i></i><b></b><span></span>`;
    li.querySelector('i').style.background = item.color;
    li.querySelector('b').textContent = item.label;

/* ---------- 合批：所有静态零件按材质装进 4 个桶 ---------- */
const BUCKETS = new Map();
function bucket(name) {
  let b = BUCKETS.get(name);
  if (!b) {
    b = { pos: [], nor: [], uv: [], col: [], piv: [], del: [] };
    BUCKETS.set(name, b);
  }
  return b;
}
let nowDelay = 0;
function layer(d) { nowDelay = d; }

const _col = new THREE.Color();
const _m = new THREE.Matrix4();
const _q = new THREE.Quaternion();
const _e = new THREE.Euler();
const _p = new THREE.Vector3();
const _s = new THREE.Vector3();

/* 整块内容沿街平移用：设 OX 后，接下来 addGeo 的 x 全部加上这个偏移 */
let OX = 0;

function addGeo(geo, hex, o = {}) {
  const x = (o.x || 0) + OX, y = o.y || 0, z = o.z || 0;
  _e.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ');
  _q.setFromEuler(_e);
  _p.set(x, y, z);
  _s.set(o.sx || 1, o.sy || 1, o.sz || 1);
  _m.compose(_p, _q, _s);

  const g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(_m);
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const thin = Math.min(
    Math.abs(bb.max.x - bb.min.x),
    Math.abs(bb.max.y - bb.min.y),
    Math.abs(bb.max.z - bb.min.z)
  ) < 0.058;
  /* 比描边还细的零件（电线、竹签、栅条）不描边，否则会被墨线糊掉 */
  const b = bucket(o.bucket || (thin ? 'fine' : 'solid'));
  const pa = g.attributes.position.array;
  const na = g.attributes.normal.array;
  const ua = g.attributes.uv ? g.attributes.uv.array : null;

  _col.set(hex);
  if (o.tint) _col.multiply(new THREE.Color(o.tint));
  const jit = o.jitter === false ? 1 : 0.95 + rand() * 0.08;
  const cr = _col.r * jit, cg = _col.g * jit, cb = _col.b * jit;

  const pivot = o.pivot ? [o.pivot[0] + OX, o.pivot[1], o.pivot[2]] : [x, 0, z];
  const d = o.delay != null ? o.delay : nowDelay;
  const uvR = o.uvRect;
  const n = pa.length / 3;
  for (let i = 0; i < n; i++) {
    b.pos.push(pa[i * 3], pa[i * 3 + 1], pa[i * 3 + 2]);
    b.nor.push(na[i * 3], na[i * 3 + 1], na[i * 3 + 2]);
    if (ua) {
      let u = ua[i * 2], v = ua[i * 2 + 1];
      if (uvR) { u = uvR[0] + u * (uvR[2] - uvR[0]); v = uvR[1] + v * (uvR[3] - uvR[1]); }
      b.uv.push(u, v);
    } else {
      b.uv.push(0, 0);
    }
    b.col.push(cr, cg, cb);
    b.piv.push(pivot[0], pivot[1], pivot[2]);
    b.del.push(d);
  }
  g.dispose();
}

function toGeometry(b) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(b.uv, 2));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(b.col, 3));
  geo.setAttribute('aPivot', new THREE.Float32BufferAttribute(b.piv, 3));
  geo.setAttribute('aDelay', new THREE.Float32BufferAttribute(b.del, 1));
  geo.computeBoundingSphere();
  return geo;
}

const P = {
  box(w, h, d, c, x, y, z, o) { addGeo(new THREE.BoxGeometry(w, h, d), c, { ...o, x, y, z }); },
  box0(w, h, d, c, x, y0, z, o) { this.box(w, h, d, c, x, y0 + h / 2, z, o); },
  cyl(rt, rb, h, c, x, y, z, o, seg = 14) { addGeo(new THREE.CylinderGeometry(rt, rb, h, seg), c, { ...o, x, y, z }); },
  cyl0(rt, rb, h, c, x, y0, z, o, seg = 14) { this.cyl(rt, rb, h, c, x, y0 + h / 2, z, o, seg); },
  sph(r, c, x, y, z, o, ws = 12, hs = 8) { addGeo(new THREE.SphereGeometry(r, ws, hs), c, { ...o, x, y, z }); },
  plane(w, h, c, x, y, z, o) { addGeo(new THREE.PlaneGeometry(w, h), c, { ...o, x, y, z }); },
  torus(r, tube, c, x, y, z, o, rs = 8, ts = 16) {

  tube(pts, r, c, o, seg = 40, rad = 5) {

  },

  const b = BUCKETS.get(name);

  backZ: -7.5,          // 往后是实心土体

  /* 暗渠：西高东低，缓坡 */
  tunnelX0: -17.6,

  tunnelY1: -0.78,      // 东端渠底（此处出地面）
  tunnelW: 0.72,        // 渠宽（净宽，两帮内侧之间）
  tunnelH: 0.98,        // 渠高

  wallT: 0.18,          // 渠帮厚度

  get tunnelClearW() { return this.tunnelW; },
  /* 暗渠在剖面上凹进段的中心线（z） */
  get tunnelCz() { return this.cutZ - this.tunnelDepthZ / 2; },

  shaftW: 0.92,

/* 暗渠在某处的渠底高程（保持平滑，给水面和竖井用） */
function tunnelY(x) {
  const t = THREE.MathUtils.clamp((x - KA.tunnelX0) / (KA.tunnelX1 - KA.tunnelX0), 0, 1);
  return THREE.MathUtils.lerp(KA.tunnelY0, KA.tunnelY1, t);
}
/* 剖面里的暗渠做成几段平直的长条（真实剖面模型就是这么做的），
   每段都是一整块，避免逐列切出来的接缝。 */
const TUN_STEPS = 5;
function tunnelRuns() {
  const runs = [];
  const w = (KA.tunnelX1 - KA.tunnelX0) / TUN_STEPS;
  for (let i = 0; i < TUN_STEPS; i++) {
    const x0 = KA.tunnelX0 + i * w;
    const x1 = x0 + w;
    const y = tunnelY((x0 + x1) / 2);
    runs.push({ x0, x1, y });
  }
  return runs;
}
const TUN_RUNS = tunnelRuns();
function runOf(x) {
  for (const r of TUN_RUNS) if (x >= r.x0 - 0.001 && x <= r.x1 + 0.001) return r;
  return null;
}
function isShaftX(x) {
  for (const sx of KA.shaftXs) if (Math.abs(x - sx) < KA.shaftW / 2 + 0.02) return true;
  return false;
}

{

  P.box(KA.halfX * 2 + 0.56, 0.04, pd + 0.06, 0x8f7550, 0, KA.bottomY - 0.52, pcz, { jitter: false });
  P.box(KA.halfX * 2 + 0.62, 0.02, pd + 0.12, 0xc4a05a, 0, KA.bottomY - 0.55, pcz, { jitter: false });

/* ---------- 地层：整段长条 + 只在暗渠穿过的那一段逐列切 ---------- */
layer(0.02);
{
  const t0 = KA.tunnelX0, t1 = KA.tunnelX1;
  const faceZ = KA.cutZ;
  const tunnelFaceZ = KA.cutZ - KA.shaftDepthZ;

  const strataOpt = { jitter: false, bucket: 'fine' };
  const depthAll = faceZ - KA.backZ;
  const midAll = (faceZ + KA.backZ) / 2;
  const tz = KA.tunnelDepthZ;      // 暗渠凹进深度

  /* 每条地层都被暗渠切成几段：先找出被切的范围，整段用长条，切口用平直段 */
  for (const s of STRATA) {

      .filter((r) => r.y < s.top && r.y + KA.tunnelH > s.bot)
      .map((r) => [r.x0, r.x1, r.y]);

    let cursor = -KA.halfX;
    for (const [x0, x1, ry] of cuts) {

        P.box(w, s.top - s.bot, depthAll, s.c, cursor + w / 2, (s.top + s.bot) / 2, midAll, strataOpt);
      }
      const w = x1 - x0;
      const tb = ry, tt = ry + KA.tunnelH;
      /* 这一段里：层顶在上面、层底在下面 */
      if (s.top > tt) P.box(w, s.top - tt, depthAll, s.c, x0 + w / 2, (s.top + tt) / 2, midAll, strataOpt);
      if (s.bot < tb) P.box(w, tb - s.bot, depthAll, s.c, x0 + w / 2, (s.bot + tb) / 2, midAll, strataOpt);
      cursor = x1;
    }
    if (cursor < KA.halfX - 0.01) {
      const w = KA.halfX - cursor;
      P.box(w, s.top - s.bot, depthAll, s.c, cursor + w / 2, (s.top + s.bot) / 2, midAll, strataOpt);
    }
  }

  /* 剖面脸上的层界线：像剖面图那样勾一道，地层才分得清 */
  {
    const o = { jitter: false, bucket: 'fine' };
    for (const s of STRATA) {
      /* 每层下界都画一道，包括最下面的基岩底 */
      let segs = [[-KA.halfX, KA.halfX]];
      for (const sx of KA.shaftXs) {
        const a = sx - KA.shaftW / 2 - 0.05, b = sx + KA.shaftW / 2 + 0.05;
        const next = [];
        for (const [p, q] of segs) {
          if (b <= p || a >= q) { next.push([p, q]); continue; }
          if (a > p) next.push([p, a]);
          if (b < q) next.push([b, q]);
        }
        segs = next;
      }
      for (const [p, q] of segs) {
        if (q - p < 0.1) continue;
        P.box(q - p, 0.09, 0.06, 0x4a4238, (p + q) / 2, s.bot, faceZ + 0.04, o);
        P.box(q - p, 0.03, 0.075, 0x6d6252, (p + q) / 2, s.bot + 0.055, faceZ + 0.045, o);
      }
    }
  }

  /* 剖面脸上的砾石：让切面不是一块死色 */
  for (let i = 0; i < 150; i++) {
    const x = rnd(-KA.halfX + 0.4, KA.halfX - 0.4);
    if (isShaftX(x)) continue;
    P.box(rnd(0.1, 0.2), rnd(0.07, 0.12), 0.06, pick([0xb5a894, 0x8d8071, 0xc7bda8]),
      x, rnd(-2.3, -4.7), faceZ + 0.03, { rz: rnd(0, 3), jitter: false, bucket: 'fine' });
  }
  for (let i = 0; i < 60; i++) {
    const x = rnd(-KA.halfX + 0.4, KA.halfX - 0.4);
    if (isShaftX(x)) continue;
    P.box(rnd(0.08, 0.14), rnd(0.05, 0.08), 0.05, 0x9a8156,
      x, rnd(-0.6, -1.5), faceZ + 0.03, { rz: rnd(0, 3), jitter: false, bucket: 'fine' });
  }

  /* 暗渠：渠后土体 + 渠底 + 两帮（每段一整条；凹进深度用 tz，跟竖井分开） */
  for (const r of TUN_RUNS) {
    const w = r.x1 - r.x0;
    const cxr = (r.x0 + r.x1) / 2;
    const ty = r.y;
    const cz = KA.tunnelCz;
    const backFaceZ = faceZ - tz;
    /* 渠后的土体：只挖 tz 深，剩下的全填实 */
    P.box(w, KA.tunnelH + 0.1, backFaceZ - KA.backZ, 0x8f7d61,
      cxr, ty + KA.tunnelH / 2, (backFaceZ + KA.backZ) / 2, strataOpt);
    /* 渠底：铺满整个凹进深度 */
    P.box(w, KA.floorT, tz + 0.1, 0x7d6844, cxr, ty - KA.floorT / 2, cz, strataOpt);
    /* 两帮：沿 z 的两道窄墙，内侧净距正好是 tunnelW */
    for (const sgn of [-1, 1]) {
      P.box(KA.wallT, KA.tunnelH, tz + 0.06, 0x8a7550,
        cxr + sgn * (KA.tunnelW / 2 + KA.wallT / 2), ty + KA.tunnelH / 2, cz, strataOpt);
    }
  }

  /* 支撑木架：每 6 米一副，柱子贴着渠帮内侧，不插在水中间 */
  for (let x = t0 + 3; x < t1; x += 6.2) {
    const ty = runOf(x) ? runOf(x).y : tunnelY(x);
    const cz = KA.tunnelCz;
    /* 柱子做在渠帮里（跟帮同宽），只露出一点点边 */
    for (const sgn of [-1, 1]) {
      P.box(0.09, KA.tunnelH - 0.02, 0.09, KAC.woodDark,
        x, ty + KA.tunnelH / 2, cz + sgn * (KA.tunnelW / 2 + KA.wallT / 2), { jitter: false });
    }
    /* 横梁架在渠顶，水面之上 */
    P.box(0.09, 0.09, KA.tunnelW + KA.wallT * 2 + 0.02, KAC.woodDark,
      x, ty + KA.tunnelH + 0.02, cz, { jitter: false });
  }
}

/* ---------- 竖井：井口、堆土、井壁 ---------- */
layer(0.06);
{
  for (const sx of KA.shaftXs) {
    const ty = tunnelY(sx);
    /* 井筒后壁与两侧（颜色压暗一点，别做成一面发亮的大板子） */
    P.box(KA.shaftW, -ty, 0.14, 0x6f5f48, sx, ty / 2, KA.cutZ - KA.shaftDepthZ + 0.07, { jitter: false });
    for (const sgn of [-1, 1]) {
      P.box(0.12, -ty, KA.shaftDepthZ, 0x7a6648, sx + sgn * (KA.shaftW / 2 + 0.06), ty / 2, KA.cutZ - KA.shaftDepthZ / 2, { jitter: false });
    }
    /* 井壁上偶尔露出的卵石 */
    for (let i = 0; i < 5; i++) {
      P.box(0.12, 0.08, 0.06, pick([0xb5a894, 0x8d8071]), sx + rnd(-0.3, 0.3), rnd(-1.2, ty + 0.8), KA.cutZ - KA.shaftDepthZ + 0.16, { jitter: false });
    }
    /* 井口一圈堆土：贴着井口的小土埂 */

      P.box(rnd(0.2, 0.3), rnd(0.12, 0.2), rnd(0.16, 0.24), i % 3 ? 0xb0906a : 0x9c7f58, px, 0.06, pz, { ry: -a + rnd(-0.3, 0.3), jitter: true });
      P.box(rnd(0.14, 0.2), rnd(0.08, 0.14), rnd(0.12, 0.18), 0xc0a074, px + rnd(-0.06, 0.06), 0.16, pz + rnd(-0.06, 0.06), { ry: -a, jitter: true });
    }
    P.cyl(0.44, 0.5, 0.1, 0x8a7150, sx, 0.05, KA.cutZ - 0.85, { bucket: 'fine' }, 12);
  }
  /* 最西端那口是母井，井口更大更深 */
  const mx = KA.shaftXs[0];
  P.cyl(0.62, 0.7, 0.12, 0x8a7150, mx, 0.05, KA.cutZ - 0.9, { bucket: 'fine' }, 14);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    P.box(0.4, 0.3, 0.3, 0xa88a5e, mx + Math.cos(a) * 0.85, 0.14, KA.cutZ - 0.9 + Math.sin(a) * 0.62, { ry: -a, jitter: true });
  }
}
/* ---------- 30 · 渠水、渗水段、明渠、涝坝 ---------- */

/* 暗渠里的水：几乎铺满渠内净宽，段与段之间接上（进 fine 桶，别描边） */
layer(0.08);
{
  const cz = KA.tunnelCz;
  /* 比净宽只小一点点：太窄会露出两侧土色，看起来像水没摆正 */
  const wWater = KA.tunnelW - 0.02;
  const wMid = KA.tunnelW - 0.08;
  const wHi = KA.tunnelW - 0.16;
  for (const r of TUN_RUNS) {
    /* 前后各多给 0.02，让相邻两段接上，不在中间露缝 */
    const x0 = Math.max(KA.tunnelX0, r.x0 - 0.02);
    const x1 = Math.min(KA.tunnelX1, r.x1 + 0.02);
    const w = x1 - x0;
    const cxr = (x0 + x1) / 2;
    const ty = r.y;
    const o = { jitter: false, bucket: 'fine' };
    P.box(w, KA.waterH, wWater, 0x2f6f96, cxr, ty + KA.waterH / 2, cz, o);
    P.box(w, KA.waterH * 0.7, wMid, 0x4f93b8, cxr, ty + KA.waterH * 0.6, cz, o);
    P.box(w, 0.05, wHi, 0x9ed8ec, cxr, ty + KA.waterH - 0.01, cz, { jitter: false, bucket: 'glow' });
  }
}

/* 从洪积扇渗下来的那一小股水：暗渠的上游来路 */
layer(0.09);
{

{

{

/* 檐下/杆头挂的布幌（招牌图集里取一块竖幅） */
function hangingBanner(name, x, y, z, w = 0.4, h = 0.9) {
  P.box(0.5, 0.05, 0.05, KAC.woodDark, x, y + h / 2 + 0.03, z, { jitter: false });
  P.box(0.04, 0.06, 0.05, KAC.woodDark, x - 0.24, y + h / 2, z, { jitter: false });
  P.sign(name, w, h, x, y, z + 0.03, { delay: nowDelay + 0.02 });
}

function windlass(x, z, o = {}) {
  /* 井口上的辘轳：两条斜腿 + 木滚筒 + 摇把 + 绳与桶 */
  const y0 = 0.34;
  for (const sgn of [-1, 1]) {
    P.box(0.14, 1.5, 0.14, KAC.woodDark, x + sgn * 0.52, y0 + 0.62, z + sgn * 0.1, { rz: sgn * 0.16, jitter: false });
    P.box(0.5, 0.1, 0.14, KAC.woodDark, x + sgn * 0.42, y0 + 0.02, z + sgn * 0.1, { jitter: false });
  }
  P.box(0.36, 0.12, 0.9, KAC.woodDark, x, y0 + 1.28, z, { jitter: false });
  const drum = { x, y: y0 + 1.12, z };
  P.cyl(0.16, 0.16, 0.86, KAC.wood, drum.x, drum.y, drum.z, { rz: Math.PI / 2 }, 12);
  for (let i = 0; i < 4; i++) {
    P.cyl(0.17, 0.17, 0.05, KAC.woodDark, drum.x, drum.y, drum.z - 0.36 + i * 0.24, { rz: Math.PI / 2 }, 12);
  }
  /* 摇把 */
  P.cyl(0.035, 0.035, 0.42, KAC.woodDark, drum.x, drum.y, drum.z + 0.62, { rx: Math.PI / 2 }, 8);
  P.cyl(0.035, 0.035, 0.3, KAC.woodDark, drum.x, drum.y, drum.z + 0.82, { rz: Math.PI / 2 }, 8);
  /* 绳与桶交给 50 里的 hoists 单独做，才能上下动 */
}

    P.box(0.5, 0.5, 0.05, 0x9c6a3c, x + dx, 1.5, z + d / 2 + 0.07, { jitter: false });
  }
  /* 墙根的柴堆与瓜 */
  for (let i = 0; i < 5; i++) {
    P.cyl(0.07, 0.07, 1.0, KAC.wood, x + w / 2 + 0.3 + rnd(-0.1, 0.1), 0.5, z - 1.0 + i * 0.18, { rz: 1.45, jitter: false }, 6);
  }
  for (let i = 0; i < 3; i++) {
    P.sph(0.16, i % 2 ? 0xd9a24a : 0xc9b06a, x + 1.0 + i * 0.36, 0.16, z + d / 2 + 0.55, { sy: 0.8 }, 9, 6);

layer(0.22);
function grapeRow(x, z, len, ry) {
  const n = Math.max(2, Math.round(len / 2.2));
  const cos = Math.cos(ry), sin = Math.sin(ry);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const px = x + (t - 0.5) * len * cos, pz = z + (t - 0.5) * len * sin;
    P.cyl0(0.09, 0.11, 2.0, KAC.woodDark, px, 0, pz, {}, 7);
  }
  for (const sgn of [-1, 1]) {
    P.box(len, 0.1, 0.1, KAC.wood, x + sgn * 0.55 * sin, 2.0, z - sgn * 0.55 * cos, { ry, jitter: false });
  }
  P.box(len + 0.4, 0.08, 0.08, KAC.wood, x, 2.0, z, { ry, jitter: false });
  /* 藤与叶 */
  for (let i = 0; i < n * 5; i++) {
    const t = rand();
    const px = x + (t - 0.5) * len * cos + rnd(-0.6, 0.6) * sin;
    const pz = z + (t - 0.5) * len * sin - rnd(-0.6, 0.6) * cos;
    P.sph(rnd(0.16, 0.3), pick([KAC.grape, KAC.grapeHi, 0x6f8a3f]), px, 1.95 + rnd(-0.1, 0.12), pz, { sy: 0.5 }, 7, 5);
    if (rand() < 0.34) {
      const gx = px + rnd(-0.3, 0.3), gz = pz + rnd(-0.3, 0.3);
      P.sph(0.1, KAC.fruit, gx, 1.72, gz, { sy: 1.5 }, 7, 5);
    }
  }
  /* 藤根 */
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const px = x + (t - 0.5) * len * cos, pz = z + (t - 0.5) * len * sin;
    P.cyl(0.07, 0.1, 1.9, 0x6b4f2c, px + rnd(-0.1, 0.1), 0.95, pz + rnd(-0.1, 0.1), { rz: rnd(-0.06, 0.06), jitter: false }, 6);
  }
}

/* ---------- 人：低模、无脸，跟场景同一套描边 ---------- */
function person(x, z, o = {}) {
  const ry = o.ry || 0;
  let s = (o.s || 1) * 1.06;
  const sit = !!o.sit;
  const baseY = o.baseY != null ? o.baseY : 0.03;
  const coat = o.coat || pick([0x8a6a44, 0xb8452f, 0x5f6f8a, 0xd9c39a, 0x7a5a3a, 0x9c6a3c]);
  const pants = o.pants || pick([0x4a3a2a, 0x5a4a3a, 0x2f3a44]);
  const skin = pick([0xe0c39a, 0xd6b48c, 0xeed0ac]);
  const hat = o.hat !== undefined ? o.hat : pick([null, 0xd9c39a, 0x8a6a44, 0xd9b46a]);
  const cos = Math.cos(ry), sin = Math.sin(ry);
  const at = (lx, lz) => [x + lx * cos - lz * sin, z + lx * sin + lz * cos];
  const put = (w, h, d, c, lx, ly, lz, rz = 0) => {
    const [px, pz] = at(lx * s, lz * s);
    P.box(w * s, h * s, d * s, c, px, baseY + ly * s, pz, { ry, rz, jitter: false });
  };
  if (!sit) {
    put(0.13, 0.6, 0.16, pants, -0.1, 0.3, 0);
    put(0.13, 0.6, 0.16, pants, 0.1, 0.3, 0);
  }
  put(0.42, 0.6, 0.26, coat, 0, sit ? 0.78 : 0.92, 0);
  put(0.44, 0.08, 0.28, 0xd9b777, 0, sit ? 0.55 : 0.72, 0);
  for (const side of [-1, 1]) {
    put(0.11, 0.48, 0.13, coat, side * 0.26, sit ? 0.88 : 0.94, 0.02, side * 0.06);
    put(0.1, 0.12, 0.12, skin, side * 0.27, sit ? 0.62 : 0.68, 0.05);
  }
  const headY = sit ? 1.26 : 1.4;
  P.sph(0.15 * s, skin, x, baseY + headY * s, z, { jitter: false }, 9, 6);
  if (hat === null) {
    P.sph(0.155 * s, 0x2a2420, x, baseY + (headY + 0.05) * s, z, { sy: 0.6, jitter: false }, 8, 5);
  } else {
    P.cyl(0.05 * s, 0.34 * s, 0.12 * s, hat, x, baseY + (headY + 0.13) * s, z, { jitter: false }, 10);
  }
  if (o.basket) {
    const [bx, bz] = at(0.32 * s, 0.12 * s);
    P.cyl(0.12 * s, 0.1 * s, 0.16 * s, KAC.wood, bx, baseY + 0.62 * s, bz, { jitter: false }, 8);
  }
}

function radialTexture(size = 128) {
  const cv = document.createElement('canvas');
  cv.width = size;
  cv.height = size;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,236,196,0.55)');
  grd.addColorStop(1, 'rgba(255,220,170,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/** 把某个桶单独做成一个网格（不参与合批），用来做动画 */
function makeSeparate(name) {
  const b = BUCKETS.get(name);
  if (!b || !b.pos.length) return null;
  const geo = toGeometry(b);
  const mesh = new THREE.Mesh(geo, toonMat);
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  worldGroups.add(mesh);
  BUCKETS.delete(name);
  return mesh;
}

let flowOff = 0;
function moveFlow(dt) {
  if (!flow) return;
  flowOff += dt * 1.5;
  if (flowOff > 6.4) flowOff -= 6.4;
  flow.position.x = flowOff;
  /* 条纹是合并的一个网格，靠整体平移循环；坡降用轻微上下补偿 */
  flow.position.y = -(flowOff / (KA.tunnelX1 - KA.tunnelX0)) * (KA.tunnelY0 - KA.tunnelY1) * -1;
}

/* 把镜头目标设过去（updateCamera 会插值，形成「飞过去」的效果） */
function flyTo(v) {
  if (Number.isFinite(v.az)) cam.goalAz = v.az;
  if (Number.isFinite(v.pol)) cam.goalPol = v.pol;
  if (Number.isFinite(v.dist)) cam.goalDist = v.dist;
  if (Number.isFinite(v.tx) || Number.isFinite(v.ty) || Number.isFinite(v.tz)) {
    camTargetGoal.set(
      Number.isFinite(v.tx) ? v.tx : cam.target.x,
      Number.isFinite(v.ty) ? v.ty : cam.target.y,
      Number.isFinite(v.tz) ? v.tz : cam.target.z
    );
  }
  lastInput = NOW;                 // 别让闲置自转马上把镜头带走
}

  cam.target.z = THREE.MathUtils.clamp(cam.target.z, -7, 7);
}
/* 手动平移/走动时，把目标点同步给插值目标，否则会互相拽 */
function syncTargetGoal() {
  clampTarget();
  camTargetGoal.copy(cam.target);
}
function panBy(dx, dy) {
  const k = (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * cam.dist * fitK) / Math.max(window.innerHeight, 1);
  const rx = Math.cos(cam.az), rz = -Math.sin(cam.az);
  const fx = -Math.sin(cam.az), fz = -Math.cos(cam.az);
  cam.target.x += -rx * dx * k + fx * dy * k;
  cam.target.z += -rz * dx * k + fz * dy * k;
  syncTargetGoal();
  lastInput = NOW;
}
const held = new Set();
const MOVE_KEYS = ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'];
window.addEventListener('keydown', (e) => {
  const k = (e.key || '').toLowerCase();
  if (MOVE_KEYS.includes(k)) { held.add(k); lastInput = NOW; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => held.delete((e.key || '').toLowerCase()));
window.addEventListener('blur', () => held.clear());
function moveByKeys(dt) {
  if (!held.size) return;
  const sp = Math.sin(cam.az), cs = Math.cos(cam.az);
  const fx = -sp, fz = -cs, rx = cs, rz = -sp;
  let mx = 0, mz = 0;
  const speed = 12 * (cam.dist / 60);
  if (held.has('w') || held.has('arrowup')) { mx += fx; mz += fz; }
  if (held.has('s') || held.has('arrowdown')) { mx -= fx; mz -= fz; }
  if (held.has('d') || held.has('arrowright')) { mx += rx; mz += rz; }
  if (held.has('a') || held.has('arrowleft')) { mx -= rx; mz -= rz; }
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    cam.target.x += (mx / len) * speed * dt;
    cam.target.z += (mz / len) * speed * dt;
    syncTargetGoal();
    lastInput = NOW;
  }
}
function onPointerDown(e) {
  finishIntro();
  /* 合成事件/某些浏览器下 setPointerCapture 会抛 NotFoundError，别让它中断后面的逻辑 */
  try { canvas.setPointerCapture?.(e.pointerId); } catch (err) { /* 拿不到捕获也能拖动 */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true;
  panning = e.button === 2 || e.button === 1 || e.shiftKey;
  lastX = e.clientX; lastY = e.clientY;
  lastInput = NOW;
  canvas.classList.add('grabbing');
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    lastMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  }
}
function onPointerMove(e) {
  if (!pointers.has(e.pointerId)) return;      // 悬停探测交给 tour 组件
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  lastInput = NOW;
  if (pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * (pinchDist / Math.max(d, 1)), 10, 140);
    pinchDist = d;
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (lastMid) panBy(mid.x - lastMid.x, mid.y - lastMid.y);
    lastMid = mid;
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (panning) { panBy(dx, dy); return; }
  cam.goalAz -= dx * 0.0055;
  cam.goalPol = THREE.MathUtils.clamp(cam.goalPol - dy * 0.0042, 0.16, 1.42);
}
function onPointerUp(e) {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) { dragging = false; panning = false; canvas.classList.remove('grabbing'); }
  pinchDist = 0;
  lastMid = null;
}
canvas.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  finishIntro();
  cam.goalDist = THREE.MathUtils.clamp(cam.goalDist * Math.exp(e.deltaY * 0.0011), 10, 140);
  lastInput = NOW;
}, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function updateCamera(dt, now) {
  if (intro.done) {
    const k = Math.min(1, dt * 3.2);
    cam.dist += (cam.goalDist - cam.dist) * k;
    cam.az += (cam.goalAz - cam.az) * k;
    cam.pol += (cam.goalPol - cam.pol) * k;
    /* 看点也插值，点热点飞过去才顺 */
    cam.target.lerp(camTargetGoal, k);
    clampTarget();
    /* 闲置一会儿就慢慢转 */
    if (now - lastInput > 6) cam.goalAz += dt * 0.06;
  } else {
    /* 入场：从高处落下并绕到默认视角。
       进度同时看累计 dt 和墙钟时间，任何环境下都保证会结束（否则交互会被锁死） */
    intro.t = Math.max(intro.t + dt, (performance.now() - (intro.deadline - intro.dur * 1000)) / 1000);
    const k = 1 - Math.pow(1 - Math.min(1, intro.t / intro.dur), 3);
    cam.az = THREE.MathUtils.lerp(-0.5, cam.goalAz, k);
    cam.pol = THREE.MathUtils.lerp(0.8, cam.goalPol, k);
    cam.dist = THREE.MathUtils.lerp(120, cam.goalDist, k);
    cam.target.copy(camTargetGoal);
    if (intro.t >= intro.dur || performance.now() >= intro.deadline) finishIntro();
  }
  const d = cam.dist * fitK;
  const sp = Math.sin(cam.pol), cp = Math.cos(cam.pol);
  camera.position.set(
    cam.target.x + Math.sin(cam.az) * sp * d,
    cam.target.y + cp * d,
    cam.target.z + Math.cos(cam.az) * sp * d
  );
  camera.lookAt(cam.target);
}

/* ---------- 主循环 ---------- */
const clockAssemble = { t: 0 };
function frame() {
  tickTime();
  const dt = timeState.delta;
  const now = timeState.elapsed;
  NOW = now;

  if (U.assemble.value < 1) {
    clockAssemble.t += dt;
    U.assemble.value = Math.min(1, clockAssemble.t / 3.6);
  }
  U.time.value = now;

  moveFlow(dt);

  /* 辘轳提水：桶上上下下，绳子跟着伸缩 */
  for (const g of hoists) {
    const u = g.userData;
    const k = (Math.sin(now * 0.55 + u.phase) + 1) / 2;
    const top = u.drumY - 0.6;
    const y = THREE.MathUtils.lerp(top, -Math.abs(tunnelY(u.x)) + 1.5, 1 - k);
    const len = Math.max(0.2, u.drumY - 0.16 - y);
    u.bucket.position.set(u.x, y, u.z);
    u.rope.position.set(u.x, y + len / 2, u.z);
    u.rope.scale.set(1, len, 1);
  }

  /* 水面呼吸 */
  if (flow) flow.position.y += Math.sin(now * 1.6) * 0.004;
  if (pond) pond.position.y = Math.sin(now * 1.1) * 0.012;
  /* 水轮匀速转 */
  if (millWheel) millWheel.rotation.z = -now * 0.7;

  /* 馕坑的烟 */
  for (let i = 0; i < NAAN_N; i++) {
    naanPos[i * 3 + 1] += dt * (0.3 + naanSeed[i] * 0.24);
    naanPos[i * 3] += Math.sin(now * 0.7 + i) * dt * 0.1;
    if (naanPos[i * 3 + 1] > NAAN_Y0 + 2.6) {
      naanPos[i * 3] = NAAN_X + rnd(-0.18, 0.18);
      naanPos[i * 3 + 1] = NAAN_Y0;
      naanPos[i * 3 + 2] = NAAN_Z + rnd(-0.18, 0.18);
    }
  }
  naanGeo.attributes.position.needsUpdate = true;

  for (const s of glowSprites) {
    s.material.opacity = s.userData.base * (0.9 + 0.1 * Math.sin(now * s.userData.speed + s.userData.phase));
  }

  moveByKeys(dt);
  updateCamera(dt, now);
  renderer.render(scene, camera);

  if (firstFrame) {
    firstFrame = false;
    const boot = document.getElementById('boot');
    if (boot) {
      if (SHOT) boot.style.display = 'none';
      else boot.classList.add('gone');
    }
    window.__MINS_READY = true;
  }
  requestAnimationFrame(frame);
}
let firstFrame = true;
requestAnimationFrame(frame);

window.__MINS_DIAG = () => ({
