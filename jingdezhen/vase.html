<body>
  <div class="panel"><h1>景德镇拉坯泥坯</h1><p id="status">正在加载模型…</p><p>拖动旋转，滚轮缩放；点击模型查看部件。模型依据单张编辑参考图重建。</p><button id="explode" type="button">拆解部件</button></div>
